<!-- src/app/components/homepage/homepage.component.html -->
<div class="homepage-container">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <span class="material-icons">menu</span>
      </button>
      <h1 class="logo">Eduflex</h1>
    </div>
    
    <div class="header-right">
      <div class="user-info">
        <span class="welcome">Welcome, {{userInfo?.name || 'User'}}</span>
        <div class="user-actions">
          <button class="btn-icon" title="Profile">
            <span class="material-icons">person</span>
          </button>
          <button class="btn-icon" title="Notifications">
            <span class="material-icons">notifications</span>
          </button>
          <button class="btn-icon" title="Logout" (click)="logout()">
            <span class="material-icons">logout</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Sidebar -->
    <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
      <nav class="sidebar-nav">
        <ul>
          <li *ngFor="let item of menuItems" class="nav-item">
            <a [routerLink]="item.route" 
               routerLinkActive="active" 
               class="nav-link">
              <span class="material-icons nav-icon">{{item.icon}}</span>
              <span class="nav-text" *ngIf="!isSidebarCollapsed">{{item.title}}</span>
            </a>
            
            <!-- Submenu -->
            <ul *ngIf="item.children && !isSidebarCollapsed" class="submenu">
              <li *ngFor="let child of item.children" class="nav-item">
                <a [routerLink]="child.route" 
                   routerLinkActive="active" 
                   class="nav-link sublink">
                  <span class="material-icons nav-icon">{{child.icon}}</span>
                  <span class="nav-text">{{child.title}}</span>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Content Area -->
    <main class="content-area" [class.full-width]="isSidebarCollapsed">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
