<app-document-uploader-zone
  [files]="files" [label]="label" [emptyText]="emptyText" [uploadLabel]="uploadLabel"
  [maxCount]="maxCount" [canUpload]="canUpload" [isUploading]="isUploading"
  [showNotes]="showNotes" [savingNoteFileIds]="savingNoteFileIds" uploadCategory="enrolment"
  [locked]="locked" [lockedBadgeText]="lockedBadgeText" [lockedMessage]="lockedMessage"
  [lockedFileLabel]="lockedFileLabel" [lockedFileSub]="lockedFileSub"
  (viewLocked)="viewLocked.emit()" (updateLocked)="updateLocked.emit()"
  (fileSelected)="onFileSelected($event)" (noteChanged)="onNoteChanged($event)">
</app-document-uploader-zone>
