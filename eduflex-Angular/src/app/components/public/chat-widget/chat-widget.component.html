<div class="chat-widget">
    <button type="button" class="chat-toggle-btn" (click)="toggleOpen()"
        [attr.aria-label]="isOpen ? 'Close chat' : 'Open chat'">
        <span *ngIf="!isOpen">💬</span>
        <span *ngIf="isOpen">&times;</span>
    </button>

    <div class="chat-panel" *ngIf="isOpen">
        <div class="chat-header">
            <h3>Visa Q&amp;A AI Assistant</h3>
            <p class="chat-subtitle">General information only — not migration advice.</p>
        </div>

        <div class="chat-messages">
            <div class="chat-empty" *ngIf="messages.length === 0">
                <p>Ask a general question about student visas, or try one below:</p>
                <div class="chat-faq-list">
                    <button type="button" class="chat-faq-btn" *ngFor="let q of faqQuestions" (click)="askFaq(q)">
                        {{ q }}
                    </button>
                </div>
            </div>

            <div class="chat-message" [ngClass]="msg.role" *ngFor="let msg of messages">
                <div class="chat-bubble">{{ msg.text }}</div>
            </div>

            <div class="chat-message assistant" *ngIf="isSending">
                <div class="chat-bubble chat-typing">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>

            <div #messagesEnd></div>
        </div>

        <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <form class="chat-input-row" (ngSubmit)="sendQuestion()">
            <input type="text" [(ngModel)]="currentQuestion" name="question" placeholder="Type your question..."
                maxlength="500" [disabled]="isSending || isLimitReached">
            <button type="submit" class="btn-primary"
                [disabled]="isSending || !currentQuestion.trim() || isLimitReached">Send</button>
        </form>
    </div>
</div>
