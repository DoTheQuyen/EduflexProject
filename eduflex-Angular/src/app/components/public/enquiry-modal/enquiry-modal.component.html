<div class="modal-backdrop" (click)="onBackdropClick()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <button type="button" class="modal-close" (click)="close()" aria-label="Close">&times;</button>

    <h2>{{ 'ENQUIRY.TITLE' | translate }}</h2>
    <p class="modal-subtitle">{{ 'ENQUIRY.SUBTITLE' | translate }}</p>

    <form [formGroup]="enquiryForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">{{ 'ENQUIRY.FIRST_NAME' | translate }}</label>
          <input id="firstName" type="text" formControlName="firstName" [class.invalid]="isFieldInvalid('firstName')">
          <span class="field-error" *ngIf="isFieldInvalid('firstName')">{{ getFieldError('firstName') }}</span>
        </div>

        <div class="form-group">
          <label for="middleName">{{ 'ENQUIRY.MIDDLE_NAME' | translate }}</label>
          <input id="middleName" type="text" formControlName="middleName" [class.invalid]="isFieldInvalid('middleName')">
          <span class="field-error" *ngIf="isFieldInvalid('middleName')">{{ getFieldError('middleName') }}</span>
        </div>

        <div class="form-group">
          <label for="lastName">{{ 'ENQUIRY.LAST_NAME' | translate }}</label>
          <input id="lastName" type="text" formControlName="lastName" [class.invalid]="isFieldInvalid('lastName')">
          <span class="field-error" *ngIf="isFieldInvalid('lastName')">{{ getFieldError('lastName') }}</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">{{ 'ENQUIRY.EMAIL' | translate }}</label>
          <input id="email" type="email" formControlName="email" [class.invalid]="isFieldInvalid('email')">
          <span class="field-error" *ngIf="isFieldInvalid('email')">{{ getFieldError('email') }}</span>
        </div>

        <div class="form-group">
          <label for="mobile">{{ 'ENQUIRY.MOBILE' | translate }}</label>
          <input id="mobile" type="tel" formControlName="mobile" [class.invalid]="isFieldInvalid('mobile')">
          <span class="field-error" *ngIf="isFieldInvalid('mobile')">{{ getFieldError('mobile') }}</span>
        </div>
      </div>

      <div class="form-group">
        <label for="enquiry">{{ 'ENQUIRY.ENQUIRY_LABEL' | translate }}</label>
        <textarea id="enquiry" rows="4" formControlName="enquiry" [class.invalid]="isFieldInvalid('enquiry')"></textarea>
        <span class="field-error" *ngIf="isFieldInvalid('enquiry')">{{ getFieldError('enquiry') }}</span>
      </div>

      <div class="recaptcha-wrap">
        <div #recaptchaContainer></div>
      </div>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting">
        {{ isSubmitting ? ('ENQUIRY.SUBMITTING' | translate) : ('ENQUIRY.SUBMIT' | translate) }}
      </button>
    </form>
  </div>
</div>
