<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Annotated wireframe of the Communication tab: compose panel and sent history">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .tick  { stroke: #4f46e5; stroke-width: 2; fill: none; stroke-linecap: round; }
  </style>

  <rect x="0" y="0" width="900" height="430" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="429" rx="6" class="line"/>

  <!-- LEFT: compose -->
  <rect x="22" y="20" width="424" height="390" rx="5" class="line"/>
  <rect x="22" y="20" width="424" height="32" rx="5" fill="#f8fafc"/>
  <line x1="22" y1="52" x2="446" y2="52" class="line"/>
  <text class="t sm bold" x="38" y="40">Messages</text>
  <rect x="378" y="26" width="54" height="20" rx="4" fill="#4f46e5"/>
  <text class="t sm" x="392" y="40" fill="#ffffff">Close</text>

  <!-- recipient chips -->
  <rect x="38" y="64" width="66" height="22" rx="11" fill="#4f46e5"/>
  <text class="t sm" x="52" y="79" fill="#ffffff">Student</text>
  <rect x="112" y="64" width="118" height="22" rx="11" class="soft"/>
  <text class="t sm muted" x="124" y="79">Education partner</text>
  <rect x="238" y="64" width="112" height="22" rx="11" class="soft"/>
  <text class="t sm muted" x="250" y="79">Business partner</text>

  <text class="t sm bold" x="38" y="110">To</text>
  <rect x="38" y="116" width="392" height="22" rx="4" class="soft"/>
  <text class="t sm muted" x="48" y="131">minh.tran@example.com</text>

  <!-- template buttons -->
  <rect x="38" y="150" width="104" height="20" rx="4" fill="#4f46e5"/>
  <text class="t sm" x="50" y="164" fill="#ffffff">Offer received</text>
  <rect x="150" y="150" width="104" height="20" rx="4" class="soft"/>
  <text class="t sm muted" x="162" y="164">CoE issued</text>
  <rect x="262" y="150" width="96" height="20" rx="4" class="soft"/>
  <text class="t sm muted" x="274" y="164">Docs needed</text>

  <text class="t sm bold" x="38" y="192">Subject</text>
  <rect x="38" y="198" width="392" height="22" rx="4" class="soft"/>
  <text class="t sm bold" x="38" y="240">Message</text>
  <rect x="38" y="246" width="392" height="70" rx="4" class="soft"/>

  <!-- attachments -->
  <text class="t sm bold" x="38" y="336">Attach documents</text>
  <rect class="box" x="38" y="344" width="11" height="11" rx="2"/><path class="tick" d="M40 349.5 l2.5 2.5 l4.5 -5"/>
  <text class="t sm" x="58" y="354">offer-letter.pdf</text>
  <text class="t sm muted" x="330" y="354">Apply Offer</text>
  <rect class="box" x="38" y="364" width="11" height="11" rx="2"/>
  <text class="t sm" x="58" y="374">passport.pdf</text>
  <text class="t sm muted" x="330" y="374">Student Info</text>
  <text class="t sm muted" x="38" y="394">1 selected — sent as expiring download links.</text>

  <!-- RIGHT: history -->
  <rect x="462" y="20" width="416" height="390" rx="5" class="line"/>
  <rect x="462" y="20" width="416" height="32" rx="5" fill="#f8fafc"/>
  <line x1="462" y1="52" x2="878" y2="52" class="line"/>
  <text class="t sm bold" x="478" y="40">Sent history</text>

  <g>
    <text class="t sm muted" x="478" y="76">Jo Diaz → Student  minh.tran@example.com</text>
    <text class="t sm muted" x="790" y="76">14/08 09:12</text>
    <text class="t sm bold" x="478" y="94">Your offer has arrived</text>
    <text class="t sm muted" x="478" y="110">Hi Minh, good news — Southbank has made you an…</text>
    <text class="t sm muted" x="478" y="126">1 document(s) attached</text>
    <line x1="478" y1="138" x2="862" y2="138" class="soft"/>

    <text class="t sm muted" x="478" y="160">Sarah Chen → EducationPartner  admissions@…</text>
    <text class="t sm muted" x="790" y="160">11/08 16:40</text>
    <text class="t sm bold" x="478" y="178">Application follow-up</text>
    <text class="t sm muted" x="478" y="194">Following up on the application submitted last…</text>
    <line x1="478" y1="210" x2="862" y2="210" class="soft"/>
  </g>

  <!-- Callouts -->
  <circle class="cal" cx="420" cy="14" r="11"/><text class="caltx" x="416.5" y="18">1</text>
  <circle class="cal" cx="10" cy="75" r="11"/><text class="caltx" x="6.5" y="79">2</text>
  <circle class="cal" cx="10" cy="127" r="11"/><text class="caltx" x="6.5" y="131">3</text>
  <circle class="cal" cx="10" cy="160" r="11"/><text class="caltx" x="6.5" y="164">4</text>
  <circle class="cal" cx="10" cy="350" r="11"/><text class="caltx" x="6.5" y="354">5</text>
  <circle class="cal" cx="450" cy="76" r="11"/><text class="caltx" x="446.5" y="80">6</text>
</svg>
