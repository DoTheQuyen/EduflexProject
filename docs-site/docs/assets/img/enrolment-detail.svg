<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Annotated wireframe of the enrolment detail screen: header buttons, tab bar and the six-step VISA process">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="440" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="439" rx="6" class="line"/>

  <!-- Header -->
  <text class="t md bold" x="28" y="36">Minh Tran</text>
  <rect x="112" y="24" width="60" height="16" rx="8" fill="#dbeafe"/><text class="t sm" x="120" y="36" fill="#1d4ed8">Apply Visa</text>
  <rect x="600" y="22" width="72" height="24" rx="5" class="soft"/><text class="t sm muted" x="614" y="38">Reassign</text>
  <rect x="682" y="22" width="66" height="24" rx="5" class="soft" stroke="#4f46e5"/><text class="t sm" x="694" y="38" fill="#4f46e5">Finalize</text>
  <rect x="758" y="22" width="102" height="24" rx="5" fill="#4f46e5"/><text class="t sm" x="770" y="38" fill="#ffffff">Financial record</text>

  <!-- Tab bar -->
  <line x1="0" y1="76" x2="900" y2="76" class="line"/>
  <text class="t sm bold" x="30" y="64">VISA Process</text>
  <line x1="24" y1="76" x2="118" y2="76" stroke="#4f46e5" stroke-width="2"/>
  <g class="t sm muted">
    <text x="136" y="64">Documents</text>
    <text x="222" y="64">Forms</text>
    <text x="278" y="64">Communication</text>
    <text x="388" y="64">Audit Trail</text>
    <text x="468" y="64">Tasks</text>
  </g>

  <!-- Steps accordion -->
  <g>
    <rect x="28" y="92" width="832" height="34" rx="5" class="soft" fill="#f8fafc"/>
    <circle cx="48" cy="109" r="8" fill="#16a34a"/><text class="t sm" x="45" y="113" fill="#ffffff">✓</text>
    <text class="t sm bold" x="66" y="106">1. Student Info</text>
    <text class="t sm muted" x="66" y="120">Personal details captured at enquiry conversion</text>
    <rect x="762" y="101" width="62" height="16" rx="8" fill="#dcfce7"/><text class="t sm" x="770" y="113" fill="#15803d">Complete</text>

    <rect x="28" y="132" width="832" height="34" rx="5" class="soft" fill="#f8fafc"/>
    <circle cx="48" cy="149" r="8" fill="#16a34a"/><text class="t sm" x="45" y="153" fill="#ffffff">✓</text>
    <text class="t sm bold" x="66" y="146">2. Enrolment Form</text>
    <text class="t sm muted" x="66" y="160">Course, intake &amp; Genuine Student statement</text>
    <rect x="762" y="141" width="62" height="16" rx="8" fill="#dcfce7"/><text class="t sm" x="770" y="153" fill="#15803d">Complete</text>
  </g>

  <!-- Open step -->
  <rect x="28" y="172" width="832" height="180" rx="5" class="line" stroke="#4f46e5"/>
  <rect x="28" y="172" width="832" height="34" rx="5" fill="#eef2ff"/>
  <circle cx="48" cy="189" r="8" fill="#4f46e5"/><text class="t sm" x="45" y="193" fill="#ffffff">3</text>
  <text class="t sm bold" x="66" y="186">3. Apply Offer</text>
  <text class="t sm muted" x="66" y="200">Submit application, upload the university offer</text>
  <rect x="778" y="181" width="46" height="16" rx="8" fill="#fef3c7"/><text class="t sm" x="786" y="193" fill="#92400e">Draft</text>
  <text class="t sm muted" x="836" y="193">⌃</text>

  <text class="t sm bold" x="48" y="228">Course applications</text>
  <rect x="48" y="236" width="792" height="46" rx="4" class="soft"/>
  <g class="t sm muted">
    <text x="60" y="252">Southbank University · Master of IT</text>
    <text x="60" y="270">Intake Feb 2027 · Sydney CBD · Full-time</text>
  </g>
  <rect x="742" y="244" width="52" height="16" rx="8" fill="#dbeafe"/><text class="t sm" x="750" y="256" fill="#1d4ed8">Offered</text>

  <text class="t sm bold" x="48" y="302">Evidence — University offer letter</text>
  <rect x="48" y="310" width="240" height="22" rx="4" class="soft"/>
  <text class="t sm muted" x="60" y="325">Upload file</text>

  <rect x="632" y="310" width="82" height="24" rx="5" class="soft"/><text class="t sm muted" x="644" y="326">Save Draft</text>
  <rect x="724" y="310" width="116" height="24" rx="5" fill="#4f46e5"/><text class="t sm" x="744" y="326" fill="#ffffff">Mark Complete</text>

  <!-- remaining steps -->
  <g class="t sm muted">
    <rect x="28" y="360" width="832" height="30" rx="5" class="soft"/>
    <text x="66" y="379">4. CoE Completion — Confirmation of Enrolment from the institution</text>
    <rect x="28" y="396" width="832" height="30" rx="5" class="soft"/>
    <text x="66" y="415">5. VISA Application · 6. VISA Outcome</text>
  </g>

  <!-- Callouts -->
  <circle class="cal" cx="576" cy="34" r="11"/><text class="caltx" x="572.5" y="38">1</text>
  <circle class="cal" cx="14" cy="64" r="11"/><text class="caltx" x="10.5" y="68">2</text>
  <circle class="cal" cx="14" cy="109" r="11"/><text class="caltx" x="10.5" y="113">3</text>
  <circle class="cal" cx="14" cy="189" r="11"/><text class="caltx" x="10.5" y="193">4</text>
  <circle class="cal" cx="14" cy="318" r="11"/><text class="caltx" x="10.5" y="322">5</text>
  <circle class="cal" cx="878" cy="322" r="11"/><text class="caltx" x="874.5" y="326">6</text>
</svg>
