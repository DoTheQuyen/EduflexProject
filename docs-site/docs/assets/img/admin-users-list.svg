<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Annotated wireframe of the Manage Users screen">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="400" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="399" rx="6" class="line"/>

  <text class="t md bold" x="28" y="38">Manage Users</text>
  <rect x="762" y="22" width="98" height="26" rx="5" fill="#4f46e5"/>
  <text class="t sm" x="782" y="39" fill="#ffffff">+ Add User</text>

  <!-- Tabs -->
  <line x1="28" y1="76" x2="872" y2="76" class="line"/>
  <rect x="28" y="56" width="62" height="20" fill="#ffffff"/>
  <text class="t sm bold" x="40" y="70">Staffs</text>
  <line x1="28" y1="76" x2="90" y2="76" stroke="#4f46e5" stroke-width="2"/>
  <text class="t sm muted" x="106" y="70">Students</text>

  <!-- Toolbar -->
  <rect x="28" y="94" width="290" height="26" rx="4" class="soft"/>
  <text class="t sm muted" x="42" y="111">Search name or email…</text>
  <rect x="330" y="94" width="150" height="26" rx="4" class="soft"/>
  <text class="t sm" x="342" y="111">All roles</text>
  <rect x="492" y="94" width="140" height="26" rx="4" class="soft"/>
  <text class="t sm" x="504" y="111">All statuses</text>
  <rect x="644" y="94" width="30" height="26" rx="4" class="soft"/>
  <text class="t sm" x="654" y="111">&#8635;</text>

  <!-- Table -->
  <rect x="28" y="136" width="844" height="196" rx="5" class="line"/>
  <rect x="28" y="136" width="844" height="30" rx="5" fill="#f1f5f9"/>
  <line x1="28" y1="166" x2="872" y2="166" class="line"/>
  <g class="t sm bold">
    <text x="42" y="156">Email</text>
    <text x="222" y="156">First Name</text>
    <text x="330" y="156">Last Name</text>
    <text x="438" y="156">Role</text>
    <text x="546" y="156">Departments</text>
    <text x="704" y="156">Active</text>
    <text x="782" y="156">Actions</text>
  </g>
  <g class="t sm muted">
    <text x="42" y="188">s.chen@example.com</text><text x="222" y="188">Sarah</text><text x="330" y="188">Chen</text>
    <text x="438" y="188">Admissions</text><text x="704" y="188">Yes</text>
    <text x="42" y="222">j.diaz@example.com</text><text x="222" y="222">Jo</text><text x="330" y="222">Diaz</text>
    <text x="438" y="222">Finance</text><text x="704" y="222">Yes</text>
    <text x="42" y="256">a.khan@example.com</text><text x="222" y="256">Ali</text><text x="330" y="256">Khan</text>
    <text x="438" y="256">Admissions</text><text x="704" y="256">No</text>
  </g>
  <rect x="546" y="178" width="66" height="15" rx="7" fill="#e0e7ff"/>
  <text class="t sm" x="554" y="189" fill="#4338ca">Academic</text>
  <rect x="546" y="212" width="52" height="15" rx="7" fill="#e0e7ff"/>
  <text class="t sm" x="554" y="223" fill="#4338ca">Finance</text>
  <g>
    <rect x="782" y="178" width="34" height="17" rx="4" class="soft"/><text class="t sm muted" x="790" y="190">edit</text>
    <rect x="782" y="212" width="34" height="17" rx="4" class="soft"/><text class="t sm muted" x="790" y="224">edit</text>
    <rect x="782" y="246" width="34" height="17" rx="4" class="soft"/><text class="t sm muted" x="790" y="258">edit</text>
  </g>
  <line x1="28" y1="200" x2="872" y2="200" class="soft"/>
  <line x1="28" y1="234" x2="872" y2="234" class="soft"/>
  <line x1="28" y1="268" x2="872" y2="268" class="soft"/>
  <text class="t sm muted" x="42" y="312">1 – 3 of 24</text>
  <rect x="800" y="298" width="24" height="20" rx="4" class="soft"/><text class="t sm" x="809" y="312">&#8249;</text>
  <rect x="832" y="298" width="24" height="20" rx="4" class="soft"/><text class="t sm" x="841" y="312">&#8250;</text>

  <!-- Callouts -->
  <circle class="cal" cx="811" cy="16" r="11"/><text class="caltx" x="807.5" y="20">1</text>
  <circle class="cal" cx="59" cy="60" r="11"/><text class="caltx" x="55.5" y="64">2</text>
  <circle class="cal" cx="173" cy="107" r="11"/><text class="caltx" x="169.5" y="111">3</text>
  <circle class="cal" cx="405" cy="83" r="11"/><text class="caltx" x="401.5" y="87">4</text>
  <circle class="cal" cx="799" cy="187" r="11"/><text class="caltx" x="795.5" y="191">5</text>
  <circle class="cal" cx="828" cy="284" r="11"/><text class="caltx" x="824.5" y="288">6</text>
</svg>
