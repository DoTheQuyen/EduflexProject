<div class="mb-0">
  <label *ngIf="label" class="form-label">{{ label }}<span *ngIf="required" class="text-danger"> *</span></label>
  <p-datepicker
    [ngModel]="dateValue"
    (ngModelChange)="onModelChange($event)"
    [showTime]="showTime"
    [timeOnly]="timeOnly"
    [dateFormat]="dateFormat"
    [minDate]="minDate"
    [maxDate]="maxDate"
    [disabled]="disabled"
    [showIcon]="true"
    (onBlur)="onBlur()"
    styleClass="w-100"
  />
</div>
