<div class="enrolment-portal">
  <div class="container-fluid py-1">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="mb-2">Manage Enrolments</h3>
      </div>
      <div class="col-auto" *ngIf="permissions.add">
        <button type="button" class="btn btn-primary" (click)="createNew()">
          <i class="fas fa-plus me-1"></i>New Enrolment
        </button>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button type="button" class="nav-link" [class.active]="scope === 'mine'" (click)="switchScope('mine')">My Enrolments</button>
      </li>
      <li class="nav-item">
        <button type="button" class="nav-link" [class.active]="scope === 'all'" (click)="switchScope('all')">All Enrolments</button>
      </li>
    </ul>

    <div class="row">
      <div class="col-12">
        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading enrolments...</p>
        </div>

        <div *ngIf="!isLoading" class="card border shadow-sm">
          <div class="card-body p-0">
            <app-data-table
              [columns]="columns"
              [data]="enrolments"
              [rowActions]="rowActions"
              [pageNumber]="pager.pageNumber"
              [pageSize]="pager.pageSize"
              [totalCount]="pager.totalCount"
              [showSearch]="true"
              searchPlaceholder="Search name, email or mobile..."
              (searchChange)="onSearchChange($event)"
              (pageChange)="onPageChange($event)"
              (actionClick)="onTableAction($event)"
              tableClass="table table-bordered table-hover mb-0">
            </app-data-table>
            <p *ngIf="!isLoading && enrolments.length === 0" class="text-center text-muted py-4 mb-0">
              No enrolments found.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
