<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Annotated wireframe of the Finance tab: commission calculation, adjustments and the invoice request calendar">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="420" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="419" rx="6" class="line"/>

  <!-- Tab bar -->
  <line x1="0" y1="42" x2="900" y2="42" class="line"/>
  <text class="t sm muted" x="30" y="28">Enrolment Summary</text>
  <text class="t sm bold" x="166" y="28">Finance</text>
  <line x1="160" y1="42" x2="218" y2="42" stroke="#4f46e5" stroke-width="2"/>
  <g class="t sm muted">
    <text x="236" y="28">Invoice</text><text x="300" y="28">Communication</text>
    <text x="410" y="28">Audit Trail</text><text x="490" y="28">Tasks</text>
  </g>

  <!-- Calculation -->
  <rect x="28" y="58" width="424" height="176" rx="5" class="line"/>
  <text class="t sm bold" x="44" y="80">Commission calculation</text>
  <line x1="44" y1="88" x2="436" y2="88" class="soft"/>
  <g class="t sm muted">
    <text x="44" y="110">Invoice to</text>
    <text x="44" y="132">Total tuition</text>
    <text x="44" y="154">Intake</text>
    <text x="44" y="176">Course commission rate</text>
    <text x="44" y="198">Business partner commission rate</text>
  </g>
  <g class="t sm">
    <text x="300" y="110">Southbank University</text>
    <text x="300" y="132">38,000.00</text>
    <text x="300" y="154">Feb 2027</text>
    <text x="300" y="176">15%</text>
    <text x="300" y="198">4%</text>
  </g>
  <line x1="44" y1="208" x2="436" y2="208" class="soft"/>
  <text class="t sm bold" x="44" y="226">Expected commission</text>
  <text class="t sm bold" x="300" y="226">4,180.00</text>

  <!-- Received -->
  <rect x="468" y="58" width="404" height="86" rx="5" class="line"/>
  <text class="t sm bold" x="484" y="80">Commission received</text>
  <line x1="484" y1="88" x2="856" y2="88" class="soft"/>
  <text class="t sm muted" x="484" y="110">Received to date</text>
  <text class="t sm bold" x="740" y="110">2,090.00</text>
  <rect x="484" y="120" width="372" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="484" y="120" width="186" height="8" rx="4" fill="#16a34a"/>

  <!-- Adjustments -->
  <rect x="468" y="156" width="404" height="78" rx="5" class="line"/>
  <text class="t sm bold" x="484" y="178">Extra commission adjustments</text>
  <rect x="770" y="164" width="86" height="20" rx="4" class="soft" stroke="#4f46e5"/>
  <text class="t sm" x="782" y="178" fill="#4f46e5">+ Add</text>
  <line x1="484" y1="188" x2="856" y2="188" class="soft"/>
  <text class="t sm muted" x="484" y="208">Late-enrolment bonus</text>
  <text class="t sm muted" x="700" y="208">Source: Partner</text>
  <text class="t sm" x="812" y="208">+250.00</text>

  <!-- Calendar -->
  <rect x="28" y="248" width="844" height="150" rx="5" class="line"/>
  <text class="t sm bold" x="44" y="270">Invoice request calendar</text>
  <rect x="712" y="256" width="80" height="20" rx="4" class="soft"/><text class="t sm muted" x="722" y="270">Manual claim</text>
  <line x1="44" y1="280" x2="856" y2="280" class="soft"/>

  <g class="t sm">
    <text x="44" y="302">Claim 1 of 3</text>
    <text x="200" y="302">Claim date  01/09/2026</text>
    <text x="440" y="302">1,393.33</text>
  </g>
  <rect x="540" y="291" width="52" height="15" rx="7" fill="#dcfce7"/><text class="t sm" x="548" y="303" fill="#15803d">Claimed</text>

  <g class="t sm">
    <text x="44" y="332">Claim 2 of 3</text>
    <text x="200" y="332">Claim date  01/12/2026</text>
    <text x="440" y="332">1,393.33</text>
  </g>
  <rect x="540" y="321" width="46" height="15" rx="7" fill="#fef3c7"/><text class="t sm" x="548" y="333" fill="#92400e">Due</text>
  <rect x="700" y="320" width="70" height="20" rx="4" class="soft"/><text class="t sm muted" x="712" y="334">Set date</text>
  <rect x="778" y="320" width="52" height="20" rx="4" class="soft" stroke="#dc2626"/><text class="t sm" x="790" y="334" fill="#dc2626">Skip</text>

  <g class="t sm muted">
    <text x="44" y="362">Claim 3 of 3</text>
    <text x="200" y="362">Claim date  —</text>
    <text x="440" y="362">1,393.34</text>
  </g>
  <line x1="44" y1="314" x2="856" y2="314" class="soft"/>
  <line x1="44" y1="344" x2="856" y2="344" class="soft"/>

  <!-- Callouts -->
  <circle class="cal" cx="14" cy="176" r="11"/><text class="caltx" x="10.5" y="180">1</text>
  <circle class="cal" cx="14" cy="226" r="11"/><text class="caltx" x="10.5" y="230">2</text>
  <circle class="cal" cx="886" cy="110" r="11"/><text class="caltx" x="882.5" y="114">3</text>
  <circle class="cal" cx="886" cy="178" r="11"/><text class="caltx" x="882.5" y="182">4</text>
  <circle class="cal" cx="14" cy="332" r="11"/><text class="caltx" x="10.5" y="336">5</text>
  <circle class="cal" cx="886" cy="330" r="11"/><text class="caltx" x="882.5" y="334">6</text>
</svg>
