<app-generic-documents-tab
  [documents]="documents"
  [categories]="categories"
  [canManage]="canManage"
  [isUploading]="isUploading"
  introText="Every evidence file uploaded through the VISA Process, grouped by step, plus anything uploaded manually below."
  (fileSelected)="onFileSelected($event)"
  (rename)="onRename($event)"
  (deleteDocument)="onDelete($event)">

  <!-- Invoices sent to the student for this enrolment — an Enrolment-only concept (Migration
       Case has no invoicing), so it's composed here via content projection rather than baked
       into the generic component. Used to be merged into "Other documents"; now its own
       small section directly below it. -->
  <div class="doc-section invoices-section" *ngIf="invoices.length > 0">
    <div class="doc-section-head">
      <span class="label">Invoices</span>
      <span class="meta">{{ invoices.length }} file(s)</span>
    </div>
    <div class="doc-section-body">
      <div class="doc-file-row" *ngFor="let inv of invoices">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <path d="M14 2v6h6" />
        </svg>
        <span class="doc-file-meta">
          <span class="doc-file-name">{{ inv.invoiceNo }} <span class="badge-pill badge-pill-navy-soft">Invoice</span></span>
          <span class="doc-file-sub">Sent to {{ inv.recipientName }} &middot; {{ inv.sentAt | date:'dd/MM/yyyy HH:mm' }} &middot; {{ inv.status }}</span>
        </span>
        <button type="button" class="btn btn-outline-secondary btn-sm" *ngIf="inv.pdfUrl" (click)="downloadInvoice(inv)">Download</button>
      </div>
    </div>
  </div>
</app-generic-documents-tab>
