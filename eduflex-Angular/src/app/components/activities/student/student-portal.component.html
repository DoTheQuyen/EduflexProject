<!-- student-portal.component.html -->
<div class="student-portal-container">
  <!-- Header -->
  <div class="portal-header">
    <div class="welcome-section">
      <h2>Welcome, {{ studentName }}!</h2>
      <p>Student Portal</p>
    </div>
    <div class="action-section">
      <button class="btn btn-primary" (click)="onNewApplication()">
        <i class="fas fa-plus"></i> New Application
      </button>
    </div>
  </div>

  <!-- Applications Table -->
  <div class="applications-section">
    <h3>My Applications</h3>
    
    <div *ngIf="isLoading" class="loading">
      <p>Loading applications...</p>
    </div>

    <div *ngIf="!isLoading" class="table-container">
      <table datatable [dtOptions]="dtOptions" class="table table-striped">
        <thead>
          <tr>
            <th>Application ID</th>
            <th>Description</th>
            <th>Date Applied</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of applications">
            <td>{{ app.id }}</td>
            <td>{{ app.description }}</td>
            <td>{{ app.dateApplied | date:'mediumDate' }}</td>
            <td>
              <span class="status-badge" [class]="'status-' + app.status.toLowerCase()">
                {{ app.status }}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-info" (click)="viewDetails(app.id)">
                View Details
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
