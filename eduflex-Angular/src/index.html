<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Eduflex</title>
  <base href="/">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Text faces for both locales. Google serves each family split by
       unicode-range, so the Vietnamese subsets are only fetched when a page
       actually renders Vietnamese — English visitors pay nothing for them.
       Weights must stay in step with styles.css; nothing here is variable-axis
       except Source Serif 4's optical size. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- google verification to speed up SEO google search -->
  <meta name="google-site-verification" content="O-dN5XKf2qgEy_soAtZp72eo7nmRRIuURp8DqSj17dk" />
  <link rel="icon" type="image/png" href="assets/logo/eduflex-logo-mark.png">
  <script src="https://www.google.com/recaptcha/enterprise.js" async defer></script>
  <style>
    @keyframes eduflex-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <app-root>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f1b3d;">
      <div
        style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.2);border-top-color:#c99a3f;border-radius:50%;animation:eduflex-spin 0.8s linear infinite;">
      </div>
    </div>
  </app-root>
</body>

</html>
