<section class="feedback-section" *ngIf="feedbacks.length > 0">
  <div class="container">
    <div class="center-head">
      <span class="eyebrow">{{ 'FEEDBACK_CAROUSEL.EYEBROW' | translate }}</span>
      <h2>{{ 'FEEDBACK_CAROUSEL.TITLE' | translate }}</h2>
    </div>

    <div class="carousel">
      <button
        type="button"
        class="carousel-arrow"
        [disabled]="atStart"
        (click)="scrollByCard(-1)"
        [attr.aria-label]="'FEEDBACK_CAROUSEL.PREV_ARIA' | translate">&#8249;</button>

      <!-- A scroll-snap track rather than an index-swapped slide: the arrows,
           a trackpad swipe and the keyboard all drive the same scroll, and the
           number of visible cards falls out of the breakpoint instead of
           needing its own resize bookkeeping. -->
      <div class="feedback-track" #track (scroll)="updateArrowState()">
        <article class="feedback-card card-ruled" *ngFor="let feedback of feedbacks">
          <p class="feedback-quote" [class.is-clamped]="isLong(feedback.comment) && !isExpanded(feedback)">
            {{ feedback.comment }}
          </p>

          <button
            type="button"
            class="feedback-more link-more"
            *ngIf="isLong(feedback.comment)"
            (click)="toggleExpanded(feedback)">
            {{ (isExpanded(feedback) ? 'FEEDBACK_CAROUSEL.SHOW_LESS' : 'FEEDBACK_CAROUSEL.READ_MORE') | translate }}
          </button>

          <div class="feedback-person">
            <!-- Decorative: the name is shown as text alongside, so an alt here
                 would just make screen readers announce it twice. -->
            <img
              *ngIf="feedback.photoUrl; else initialsAvatar"
              class="feedback-avatar"
              [src]="feedback.photoUrl"
              alt="" />
            <ng-template #initialsAvatar>
              <span class="feedback-avatar avatar-initials" aria-hidden="true">
                {{ initials(feedback.name) }}
              </span>
            </ng-template>
            <div class="feedback-person-text">
              <p class="feedback-name">{{ feedback.name }}</p>
              <p class="feedback-course">{{ feedback.courseName }}</p>
            </div>
          </div>
        </article>
      </div>

      <button
        type="button"
        class="carousel-arrow"
        [disabled]="atEnd"
        (click)="scrollByCard(1)"
        [attr.aria-label]="'FEEDBACK_CAROUSEL.NEXT_ARIA' | translate">&#8250;</button>
    </div>

    <div class="feedback-foot">
      <a routerLink="/feedback" class="feedback-all-link">
        {{ 'FEEDBACK_CAROUSEL.VIEW_ALL' | translate }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </div>
  </div>
</section>
