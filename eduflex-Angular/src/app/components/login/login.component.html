<div class="login-container">
  <div class="login-header">
    <h2>{{ 'LOGIN.TITLE' | translate }}</h2>
    <p>{{ 'LOGIN.SUBTITLE' | translate }}</p>
  </div>

  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Email Field -->
    <div class="form-group">
      <label for="email">{{ 'LOGIN.EMAIL_LABEL' | translate }}</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        [placeholder]="'LOGIN.EMAIL_PLACEHOLDER' | translate"
        [class.error]="isFieldInvalid('email')">
      
      <div *ngIf="isFieldInvalid('email')" class="error-message">
        {{ getFieldError('email') }}
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">{{ 'LOGIN.PASSWORD_LABEL' | translate }}</label>
      <div class="password-input-container">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          formControlName="password"
          [placeholder]="'LOGIN.PASSWORD_PLACEHOLDER' | translate"
          [class.error]="isFieldInvalid('password')">
        <button type="button" class="toggle-password" (click)="togglePassword()">
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
      </div>
      <div *ngIf="isFieldInvalid('password')" class="error-message">
        {{ getFieldError('password') }}
      </div>
    </div>

    <!-- Form Options -->
    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox" formControlName="rememberMe">
        {{ 'LOGIN.REMEMBER_ME' | translate }}
      </label>
      <a href="#" class="forgot-password" (click)="onForgotPassword($event)">{{ 'LOGIN.FORGOT_PASSWORD' | translate }}</a>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <!-- Submit Button -->
    <button 
      type="submit" 
      class="login-button" 
      [disabled]="loginForm.invalid || isLoading">
      <span *ngIf="isLoading" class="loading-spinner"></span>
      {{ isLoading ? ('LOGIN.SIGNING_IN' | translate) : ('LOGIN.SIGN_IN' | translate) }}
    </button>
  </form>

  <!-- <div class="login-divider">
    <span>{{ 'LOGIN.DIVIDER' | translate }}</span>
  </div> -->



  <!-- <div class="register-link">
    {{ 'LOGIN.NO_ACCOUNT' | translate }}
    <a routerLink="/contact">{{ 'LOGIN.CONTACT_TO_REGISTER' | translate }}</a>
  </div> -->
</div>
