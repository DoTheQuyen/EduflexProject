name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [dev]
    paths:
      - 'Eduflex/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      -  name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        run: dotnet test Eduflex/Eduflex/Eduflex.sln --configuration Release

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR and build/push image
        run: |
          az acr login --name eduflexacr
          docker build -t eduflexacr.azurecr.io/eduflex-api:${{ github.sha }} -f Eduflex/Eduflex/Eduflex/Dockerfile .
          docker push eduflexacr.azurecr.io/eduflex-api:${{ github.sha }}

      - name: Update Container App
        run: az containerapp update --name eduflex-api --resource-group rg-eduflex --image eduflexacr.azurecr.io/eduflex-api:${{ github.sha }}