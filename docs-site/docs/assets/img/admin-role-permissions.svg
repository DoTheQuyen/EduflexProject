<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Annotated wireframe of the role permission matrix inside the Add Role dialog">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .tick  { stroke: #4f46e5; stroke-width: 2; fill: none; stroke-linecap: round; }
  </style>

  <rect x="0" y="0" width="900" height="430" rx="6" fill="#f1f5f9"/>
  <rect x="120" y="14" width="660" height="402" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <text class="t md bold" x="146" y="44">Add Role</text>
  <line x1="120" y1="58" x2="780" y2="58" class="line"/>

  <text class="t sm bold" x="146" y="82">Name *</text>
  <rect x="146" y="90" width="270" height="24" rx="4" class="soft"/>
  <text class="t sm muted" x="156" y="106">Admissions Officer</text>

  <text class="t sm bold" x="440" y="82">Role Type *</text>
  <rect x="440" y="90" width="314" height="24" rx="4" class="soft"/>
  <text class="t sm" x="450" y="106">Staff — Front-line staff with limited access</text>

  <text class="t sm bold" x="146" y="140">Permissions</text>

  <!-- Matrix -->
  <rect x="146" y="150" width="608" height="196" rx="4" class="line"/>
  <rect x="146" y="150" width="608" height="34" fill="#f8fafc"/>
  <line x1="146" y1="184" x2="754" y2="184" class="line"/>
  <text class="t sm bold" x="160" y="171">Module</text>
  <g class="t sm bold">
    <text x="352" y="165">View</text><text x="424" y="165">Add</text>
    <text x="494" y="165">Edit</text><text x="562" y="165">Delete</text>
    <text x="638" y="165">Reassign</text>
  </g>
  <g>
    <rect class="box" x="360" y="169" width="11" height="11" rx="2"/>
    <rect class="box" x="430" y="169" width="11" height="11" rx="2"/>
    <rect class="box" x="500" y="169" width="11" height="11" rx="2"/>
    <rect class="box" x="574" y="169" width="11" height="11" rx="2"/>
    <rect class="box" x="656" y="169" width="11" height="11" rx="2"/>
  </g>

  <g class="t sm">
    <text x="182" y="206">Applications</text>
    <text x="182" y="238">Enrolments</text>
    <text x="182" y="270">Migration Cases</text>
    <text x="182" y="302">Dynamic Forms</text>
    <text x="182" y="334">Users</text>
  </g>
  <g>
    <rect class="box" x="160" y="197" width="11" height="11" rx="2"/>
    <rect class="box" x="160" y="229" width="11" height="11" rx="2"/>
    <rect class="box" x="160" y="261" width="11" height="11" rx="2"/>
    <rect class="box" x="160" y="293" width="11" height="11" rx="2"/>
    <rect class="box" x="160" y="325" width="11" height="11" rx="2"/>
  </g>

  <!-- cells -->
  <g>
    <rect class="box" x="360" y="197" width="11" height="11" rx="2"/><path class="tick" d="M362 202.5 l2.5 2.5 l4.5 -5"/>
    <rect class="box" x="430" y="197" width="11" height="11" rx="2"/><path class="tick" d="M432 202.5 l2.5 2.5 l4.5 -5"/>
    <rect class="box" x="500" y="197" width="11" height="11" rx="2"/>
    <rect class="box" x="574" y="197" width="11" height="11" rx="2"/>
    <text class="t sm muted" x="658" y="207">—</text>

    <rect class="box" x="360" y="229" width="11" height="11" rx="2"/><path class="tick" d="M362 234.5 l2.5 2.5 l4.5 -5"/>
    <rect class="box" x="430" y="229" width="11" height="11" rx="2"/>
    <rect class="box" x="500" y="229" width="11" height="11" rx="2"/><path class="tick" d="M502 234.5 l2.5 2.5 l4.5 -5"/>
    <rect class="box" x="574" y="229" width="11" height="11" rx="2"/>
    <rect class="box" x="656" y="229" width="11" height="11" rx="2"/>

    <rect class="box" x="360" y="261" width="11" height="11" rx="2"/><path class="tick" d="M362 266.5 l2.5 2.5 l4.5 -5"/>
    <rect class="box" x="430" y="261" width="11" height="11" rx="2"/>
    <rect class="box" x="500" y="261" width="11" height="11" rx="2"/>
    <rect class="box" x="574" y="261" width="11" height="11" rx="2"/>
    <rect class="box" x="656" y="261" width="11" height="11" rx="2"/>

    <text class="t sm muted" x="364" y="303">—</text>
    <text class="t sm muted" x="434" y="303">—</text>
    <rect class="box" x="500" y="293" width="11" height="11" rx="2"/>
    <text class="t sm muted" x="578" y="303">—</text>
    <text class="t sm muted" x="658" y="303">—</text>

    <rect class="box" x="360" y="325" width="11" height="11" rx="2"/>
    <rect class="box" x="430" y="325" width="11" height="11" rx="2"/>
    <rect class="box" x="500" y="325" width="11" height="11" rx="2"/>
    <rect class="box" x="574" y="325" width="11" height="11" rx="2"/>
    <text class="t sm muted" x="658" y="335">—</text>
  </g>
  <line x1="146" y1="216" x2="754" y2="216" class="soft"/>
  <line x1="146" y1="248" x2="754" y2="248" class="soft"/>
  <line x1="146" y1="280" x2="754" y2="280" class="soft"/>
  <line x1="146" y1="312" x2="754" y2="312" class="soft"/>
  <line x1="330" y1="150" x2="330" y2="346" class="soft"/>

  <rect x="590" y="368" width="72" height="26" rx="5" class="soft"/>
  <text class="t sm muted" x="608" y="385">Cancel</text>
  <rect x="674" y="368" width="80" height="26" rx="5" fill="#4f46e5"/>
  <text class="t sm" x="691" y="385" fill="#ffffff">Save Role</text>

  <!-- Callouts -->
  <circle class="cal" cx="365" cy="145" r="11"/><text class="caltx" x="361.5" y="149">1</text>
  <circle class="cal" cx="134" cy="202" r="11"/><text class="caltx" x="130.5" y="206">2</text>
  <circle class="cal" cx="530" cy="234" r="11"/><text class="caltx" x="526.5" y="238">3</text>
  <circle class="cal" cx="690" cy="303" r="11"/><text class="caltx" x="686.5" y="307">4</text>
</svg>
