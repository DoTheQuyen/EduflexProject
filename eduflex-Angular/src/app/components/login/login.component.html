<div class="login-container">
  <div class="login-header">
    <h2>Welcome to Eduflex</h2>
    <p>Sign in to your account to continue</p>
  </div>

  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email"
        placeholder="Enter your email address"
        [class.error]="isFieldInvalid('email')">
      
      <div *ngIf="isFieldInvalid('email')" class="error-message">
        {{ getFieldError('email') }}
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-input-container">
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          id="password" 
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="isFieldInvalid('password')">
        <button type="button" class="toggle-password" (click)="togglePassword()">
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
      </div>
      <div *ngIf="isFieldInvalid('password')" class="error-message">
        {{ getFieldError('password') }}
      </div>
    </div>

    <!-- Form Options -->
    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox" formControlName="rememberMe">
        Remember me
      </label>
      <a href="#" class="forgot-password" (click)="onForgotPassword($event)">Forgot password?</a>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <!-- Submit Button -->
    <button 
      type="submit" 
      class="login-button" 
      [disabled]="loginForm.invalid || isLoading">
      <span *ngIf="isLoading" class="loading-spinner"></span>
      {{ isLoading ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>

  <div class="login-divider">
    <span>Or continue with</span>
  </div>

  <div class="social-login">
    <button type="button" class="social-button google" (click)="signInWithGoogle()">
      <span>Google</span>
    </button>
    <button type="button" class="social-button microsoft" (click)="signInWithMicrosoft()">
      <span>Microsoft</span>
    </button>
  </div>

  <div class="register-link">
    Don't have an account? 
    <a routerLink="/contact">Contact us to register</a>
  </div>
</div>
