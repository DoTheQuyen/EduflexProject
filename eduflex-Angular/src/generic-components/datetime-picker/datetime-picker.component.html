<div class="mb-0">
  <label *ngIf="label" class="form-label">{{ label }}<span *ngIf="required" class="text-danger"> *</span></label>
  <input
    [type]="inputType"
    class="form-control"
    [value]="value"
    [min]="min"
    [max]="max"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onBlur()">
</div>
