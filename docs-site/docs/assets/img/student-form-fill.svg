<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Annotated wireframe of the form fill screen">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .tick  { stroke: #4f46e5; stroke-width: 2; fill: none; stroke-linecap: round; }
  </style>

  <rect x="0" y="0" width="900" height="420" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="419" rx="6" class="line"/>

  <text class="t sm muted" x="28" y="30">&#8592; Back</text>
  <text class="t md bold" x="28" y="58">Pre-enrolment Questionnaire</text>
  <rect x="784" y="44" width="76" height="18" rx="9" fill="#e2e8f0"/>
  <text class="t sm" x="800" y="57">Requesting</text>

  <rect x="28" y="78" width="832" height="266" rx="5" class="line"/>

  <!-- Q1 rich text -->
  <text class="t sm bold" x="48" y="106">1. Describe your study goals</text>
  <text class="t sm muted" x="48" y="122">Rich text</text>
  <rect x="48" y="130" width="792" height="46" rx="4" class="soft"/>
  <rect x="48" y="130" width="792" height="16" rx="4" fill="#f8fafc"/>
  <text class="t sm muted" x="58" y="142">B  I  U</text>

  <!-- Q2 yes/no -->
  <text class="t sm bold" x="48" y="204">2. Do you currently hold a visa?</text>
  <text class="t sm muted" x="48" y="220">Yes / No</text>
  <circle cx="54" cy="234" r="6" class="box"/><circle cx="54" cy="234" r="3" fill="#4f46e5"/>
  <text class="t sm" x="70" y="238">Yes</text>
  <circle cx="120" cy="234" r="6" class="box"/>
  <text class="t sm" x="136" y="238">No</text>

  <!-- Q3 multi select -->
  <text class="t sm bold" x="48" y="272">3. Which support services interest you?</text>
  <text class="t sm muted" x="48" y="288">Multi select</text>
  <rect class="box" x="48" y="298" width="11" height="11" rx="2"/><path class="tick" d="M50 303.5 l2.5 2.5 l4.5 -5"/>
  <text class="t sm" x="70" y="308">Accommodation</text>
  <rect class="box" x="200" y="298" width="11" height="11" rx="2"/>
  <text class="t sm" x="222" y="308">Airport pickup</text>
  <rect class="box" x="340" y="298" width="11" height="11" rx="2"/><path class="tick" d="M342 303.5 l2.5 2.5 l4.5 -5"/>
  <text class="t sm" x="362" y="308">Career advice</text>

  <!-- Sticky bar -->
  <rect x="1" y="376" width="898" height="43" fill="#f8fafc"/>
  <line x1="1" y1="376" x2="899" y2="376" class="line"/>
  <text class="t sm muted" x="28" y="402">Answer the questions above, then save a draft or submit.</text>
  <rect x="574" y="386" width="58" height="24" rx="5" class="soft"/><text class="t sm muted" x="590" y="402">Back</text>
  <rect x="644" y="386" width="82" height="24" rx="5" class="soft" stroke="#4f46e5"/><text class="t sm" x="656" y="402" fill="#4f46e5">Save Draft</text>
  <rect x="738" y="386" width="110" height="24" rx="5" fill="#c7d2fe"/><text class="t sm" x="760" y="402" fill="#4f46e5">Final Submit</text>

  <!-- Callouts -->
  <circle class="cal" cx="822" cy="30" r="11"/><text class="caltx" x="818.5" y="34">1</text>
  <circle class="cal" cx="14" cy="112" r="11"/><text class="caltx" x="10.5" y="116">2</text>
  <circle class="cal" cx="14" cy="228" r="11"/><text class="caltx" x="10.5" y="232">3</text>
  <circle class="cal" cx="685" cy="366" r="11"/><text class="caltx" x="681.5" y="370">4</text>
  <circle class="cal" cx="793" cy="366" r="11"/><text class="caltx" x="789.5" y="370">5</text>
</svg>
