name: Deploy Frontend to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "eduflex-Angular/**"
      - "docs-site/**"
      - ".github/workflows/frontend-deploy.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: eduflex-Angular
        run: npm ci --legacy-peer-deps

      - name: Generate build info
        working-directory: eduflex-Angular
        env:
          BUILD_SHA: ${{ github.sha }}
        run: node scripts/generate-build-info.js

      - name: Build for production
        working-directory: eduflex-Angular
        run: npx ng build --configuration production

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build staff manual
        working-directory: docs-site
        env:
          DOCS_BASE: /help/staff/
        run: npm run build:staff

      - name: Build student manual
        working-directory: docs-site
        env:
          DOCS_BASE: /help/student/
        run: npm run build:student

      - name: Copy manuals into the app bundle
        run: |
          BROWSER_DIR=eduflex-Angular/dist/eduflex-Angular/browser
          mkdir -p "$BROWSER_DIR/help"
          cp -r docs-site/site         "$BROWSER_DIR/help/staff"
          cp -r docs-site/site-student "$BROWSER_DIR/help/student"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "eduflex-Angular/dist/eduflex-Angular/browser"
          skip_app_build: true
