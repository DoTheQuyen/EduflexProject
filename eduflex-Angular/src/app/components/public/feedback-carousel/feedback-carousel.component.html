<section class="feedback-section" *ngIf="feedbacks.length > 0">
  <div class="container">
    <div class="center-head">
      <span class="eyebrow">{{ 'FEEDBACK_CAROUSEL.EYEBROW' | translate }}</span>
      <h2>{{ 'FEEDBACK_CAROUSEL.TITLE' | translate }}</h2>
    </div>

    <div class="carousel" (mouseenter)="stopFeedbackAutoplay()" (mouseleave)="restartFeedbackAutoplay()">
      <button type="button" class="carousel-arrow carousel-arrow-prev" (click)="prevFeedbackSlide(); restartFeedbackAutoplay()" [attr.aria-label]="'FEEDBACK_CAROUSEL.PREV_ARIA' | translate">&#8249;</button>

      <div class="feedback-card">
        <div class="feedback-photo" [style.background-image]="'url(' + feedbacks[currentFeedbackIndex].photoUrl + ')'">
          <div class="feedback-photo-overlay">
            <p class="feedback-name">{{ feedbacks[currentFeedbackIndex].name }}</p>
            <p class="feedback-course">{{ feedbacks[currentFeedbackIndex].courseName }}</p>
          </div>
        </div>
        <div class="feedback-quote-wrap">
          <span class="quote-mark">&#8220;</span>
          <p>{{ feedbacks[currentFeedbackIndex].comment }}</p>
        </div>
      </div>

      <button type="button" class="carousel-arrow carousel-arrow-next" (click)="nextFeedbackSlide(); restartFeedbackAutoplay()" [attr.aria-label]="'FEEDBACK_CAROUSEL.NEXT_ARIA' | translate">&#8250;</button>
    </div>

    <div class="dots">
      <button
        type="button"
        *ngFor="let f of feedbacks; let i = index"
        class="dot"
        [class.is-active]="i === currentFeedbackIndex"
        (click)="goToFeedbackSlide(i)"
        [attr.aria-label]="'FEEDBACK_CAROUSEL.GO_TO_ARIA' | translate: { num: i + 1 }">
      </button>
    </div>
  </div>
</section>
