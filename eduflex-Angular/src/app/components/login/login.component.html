<div class="login-container card-ruled">
  <div class="login-header">
    <h2>{{ 'LOGIN.TITLE' | translate }}</h2>
    <p>{{ 'LOGIN.SUBTITLE' | translate }}</p>
  </div>

  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Email Field -->
    <div class="form-group">
      <label for="email">{{ 'LOGIN.EMAIL_LABEL' | translate }}</label>
      <input type="email" id="email" formControlName="email" [placeholder]="'LOGIN.EMAIL_PLACEHOLDER' | translate"
        [class.error]="isFieldInvalid('email')">

      <div *ngIf="isFieldInvalid('email')" class="error-message">
        {{ getFieldError('email') }}
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">{{ 'LOGIN.PASSWORD_LABEL' | translate }}</label>
      <div class="password-input-container">
        <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
          [placeholder]="'LOGIN.PASSWORD_PLACEHOLDER' | translate" [class.error]="isFieldInvalid('password')">

        <button type="button" class="toggle-password" (click)="togglePassword()" [attr.aria-pressed]="showPassword"
          [attr.aria-label]="(showPassword ? 'LOGIN.HIDE_PASSWORD' : 'LOGIN.SHOW_PASSWORD') | translate">
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l18 18" />
            <path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c6.4 0 10 6 10 6a17.6 17.6 0 0 1-3.4 4.1" />
            <path d="M6.5 7.6A17.4 17.4 0 0 0 2 12s3.6 6 10 6a9.9 9.9 0 0 0 3.9-.8" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        </button>
      </div>
      <div *ngIf="isFieldInvalid('password')" class="error-message">
        {{ getFieldError('password') }}
      </div>
    </div>

    <!-- Form Options -->
    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox" formControlName="rememberMe">
        {{ 'LOGIN.REMEMBER_ME' | translate }}
      </label>
      <a href="#" class="forgot-password" (click)="onForgotPassword($event)">{{ 'LOGIN.FORGOT_PASSWORD' | translate
        }}</a>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <!-- Submit Button -->
    <button type="submit" class="login-button" [disabled]="loginForm.invalid || isLoading">
      <span *ngIf="isLoading" class="loading-spinner"></span>
      {{ isLoading ? ('LOGIN.SIGNING_IN' | translate) : ('LOGIN.SIGN_IN' | translate) }}
    </button>
  </form>

  <!-- <div class="login-divider">
    <span>{{ 'LOGIN.DIVIDER' | translate }}</span>
  </div> -->



  <!-- <div class="register-link">
    {{ 'LOGIN.NO_ACCOUNT' | translate }}
    <a routerLink="/contact">{{ 'LOGIN.CONTACT_TO_REGISTER' | translate }}</a>
  </div> -->
</div>
