<div class="task-management-page">
  <div class="container-fluid py-1">
    <div class="row align-items-center mb-3">
      <div class="col">
        <h3 class="mb-2">My Tasks</h3>
        <p class="text-muted mb-0">Tasks you've assigned to others, or that are assigned to you.</p>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <app-task-list
      *ngIf="permissions.view"
      mode="my"
      [showAddButton]="permissions.add"
      (viewTask)="onViewTask($event)"
      (addTask)="onAddTask()"
    ></app-task-list>
  </div>
</div>
