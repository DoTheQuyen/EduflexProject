<div class="row g-4">
  <div class="col-lg-6">
    <div class="card border shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <strong>Messages</strong>
        <button *ngIf="permissions.edit" type="button" class="btn btn-sm btn-primary" (click)="toggleCompose()">
          {{ showComposeForm ? 'Close' : '+ Compose' }}
        </button>
      </div>
      <div class="card-body" *ngIf="showComposeForm">
        <div class="recipient-toggle">
          <button type="button" class="chip" [class.active]="recipientType === 'EducationPartner'" (click)="setRecipientType('EducationPartner')">Education Partner</button>
          <button type="button" class="chip" [class.active]="recipientType === 'BusinessPartner'" (click)="setRecipientType('BusinessPartner')">Business Partner</button>
        </div>

        <div class="mb-3">
          <label class="form-label">To</label>
          <input class="form-control" [(ngModel)]="commToEmail" [ngModelOptions]="{standalone: true}">
        </div>

        <div class="mb-3" *ngIf="generatedInvoices.length > 0">
          <label class="form-label">Attach invoice</label>
          <select class="form-select" [(ngModel)]="selectedInvoiceId" [ngModelOptions]="{standalone: true}" (change)="onInvoiceSelected()">
            <option value="">None</option>
            <option *ngFor="let inv of generatedInvoices" [value]="inv.id">{{ inv.invoiceNo }} — {{ inv.recipientName }}</option>
          </select>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3" *ngIf="templates.length > 0">
          <button type="button" class="btn btn-sm" *ngFor="let t of templates"
                  [class.btn-primary]="selectedTemplateKey === t.key" [class.btn-outline-secondary]="selectedTemplateKey !== t.key"
                  (click)="applyTemplate(t)">
            {{ t.name }}
          </button>
        </div>
        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input class="form-control" [(ngModel)]="commSubject" [ngModelOptions]="{standalone: true}">
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="7" [(ngModel)]="commBody" [ngModelOptions]="{standalone: true}"></textarea>
        </div>

        <button type="button" class="btn btn-primary" [disabled]="isSending" (click)="sendEmail()">
          {{ isSending ? 'Sending...' : 'Send email' }}
        </button>
      </div>
      <div class="card-body" *ngIf="!showComposeForm">
        <p class="text-muted small mb-0">Compose a message to the education partner or business partner.</p>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card border shadow-sm h-100">
      <div class="card-header bg-white"><strong>Sent history</strong></div>
      <div class="card-body">
        <div *ngFor="let c of record.communications" class="border-bottom pb-2 mb-2">
          <div class="d-flex justify-content-between text-muted small">
            <span>{{ c.sentByName }} &rarr; <span class="history-tag">{{ c.recipientType }}</span> {{ c.toEmail }}</span>
            <span>{{ formatDate(c.sentAt) }}</span>
          </div>
          <div class="fw-semibold">{{ c.subject }}</div>
          <div class="text-muted small">{{ c.body.length > 140 ? (c.body.substring(0,140) + '…') : c.body }}</div>
        </div>
        <p *ngIf="record.communications.length === 0" class="text-muted text-center py-3 mb-0">No emails sent yet.</p>
      </div>
    </div>
  </div>
</div>
