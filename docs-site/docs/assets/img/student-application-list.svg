<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Annotated wireframe of the student Application list screen">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="380" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="379" rx="6" class="line"/>

  <text class="t md bold" x="28" y="38">Welcome, Minh Tran</text>
  <rect x="738" y="22" width="122" height="26" rx="5" fill="#c7d2fe"/>
  <text class="t sm" x="756" y="39" fill="#4f46e5">+ New Application</text>

  <text class="t sm muted" x="28" y="60">You have 1 application — 1 in progress.</text>

  <!-- warning banner -->
  <rect x="28" y="72" width="832" height="30" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="t sm" x="44" y="91" fill="#92400e">You have an application in progress. It must be Rejected, or you must be enrolled and Studying, before you can start another.</text>

  <!-- card header -->
  <rect x="28" y="118" width="832" height="222" rx="5" class="line"/>
  <rect x="28" y="118" width="832" height="40" rx="5" fill="#f8fafc"/>
  <line x1="28" y1="158" x2="860" y2="158" class="line"/>
  <text class="t sm bold" x="44" y="143">My Applications</text>
  <rect x="404" y="126" width="220" height="24" rx="4" class="soft"/>
  <text class="t sm muted" x="418" y="142">Search applications…</text>
  <rect x="634" y="126" width="140" height="24" rx="4" class="soft"/>
  <text class="t sm" x="646" y="142">All Status</text>
  <rect x="786" y="126" width="28" height="24" rx="4" class="soft"/>
  <text class="t sm" x="795" y="142">&#8635;</text>

  <!-- table -->
  <rect x="28" y="158" width="832" height="28" fill="#f1f5f9"/>
  <line x1="28" y1="186" x2="860" y2="186" class="line"/>
  <g class="t sm bold">
    <text x="44" y="177">University</text>
    <text x="244" y="177">Course</text>
    <text x="484" y="177">Date Applied</text>
    <text x="606" y="177">Status</text>
    <text x="716" y="177">Actions</text>
  </g>
  <g class="t sm muted">
    <text x="44" y="210">Southbank University</text><text x="244" y="210">Master of IT</text><text x="484" y="210">14/08/2026</text>
    <text x="44" y="248">Harbour Institute</text><text x="244" y="248">Diploma of Business</text><text x="484" y="248">02/03/2026</text>
    <text x="44" y="286">Northfield College</text><text x="244" y="286">Bachelor of Design</text><text x="484" y="286">19/11/2025</text>
  </g>
  <rect x="602" y="199" width="54" height="16" rx="8" fill="#e2e8f0"/><text class="t sm" x="612" y="211">Pending</text>
  <rect x="602" y="237" width="60" height="16" rx="8" fill="#dcfce7"/><text class="t sm" x="610" y="249" fill="#15803d">Studying</text>
  <rect x="602" y="275" width="56" height="16" rx="8" fill="#fee2e2"/><text class="t sm" x="610" y="287" fill="#b91c1c">Rejected</text>

  <g>
    <rect x="700" y="198" width="36" height="18" rx="4" class="soft"/><text class="t sm muted" x="709" y="211">view</text>
    <rect x="744" y="198" width="34" height="18" rx="4" class="soft"/><text class="t sm muted" x="752" y="211">edit</text>
    <rect x="786" y="198" width="46" height="18" rx="4" class="soft"/><text class="t sm muted" x="794" y="211">delete</text>
    <rect x="700" y="236" width="36" height="18" rx="4" class="soft"/><text class="t sm muted" x="709" y="249">view</text>
    <rect x="700" y="274" width="36" height="18" rx="4" class="soft"/><text class="t sm muted" x="709" y="287">view</text>
  </g>
  <line x1="28" y1="224" x2="860" y2="224" class="soft"/>
  <line x1="28" y1="262" x2="860" y2="262" class="soft"/>
  <line x1="28" y1="300" x2="860" y2="300" class="soft"/>

  <!-- Callouts -->
  <circle class="cal" cx="799" cy="16" r="11"/><text class="caltx" x="795.5" y="20">1</text>
  <circle class="cal" cx="14" cy="87" r="11"/><text class="caltx" x="10.5" y="91">2</text>
  <circle class="cal" cx="514" cy="115" r="11"/><text class="caltx" x="510.5" y="119">3</text>
  <circle class="cal" cx="629" cy="196" r="11"/><text class="caltx" x="625.5" y="200">4</text>
  <circle class="cal" cx="766" cy="187" r="11"/><text class="caltx" x="762.5" y="191">5</text>
  <circle class="cal" cx="766" cy="266" r="11"/><text class="caltx" x="762.5" y="270">6</text>
</svg>
