<nav class="navbar" [class.navbar-hidden]="isNavbarHidden">
  <!-- Brand Logo -->
  <div class="nav-brand">
    <img src="assets/logo/eduflex-logo-mark.png" alt="Eduflex logo" class="logo" />
    <h1>Eduflex</h1>
  </div>

  <!-- Mobile Menu Button -->
  <button class="mobile-menu-button" (click)="toggleMobileMenu()">
    ☰
  </button>

  <!-- Main Navigation Container -->
  <div class="nav-main" [class.mobile-open]="isMobileMenuOpen">
    <!-- Navigation Menu - Now next to logo -->
    <div class="nav-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'NAV.HOME' | translate
        }}</a>
      <a routerLink="/about" routerLinkActive="active">{{ 'NAV.ABOUT' | translate }}</a>
      <a routerLink="/student-handbook" routerLinkActive="active">{{ 'NAV.HANDBOOK' | translate }}</a>
      <a routerLink="/feedback" routerLinkActive="active">{{ 'NAV.FEEDBACK' | translate }}</a>
      <!-- <a routerLink="/contact" routerLinkActive="active">{{ 'NAV.CONTACT' | translate }}</a> -->
    </div>
    <div class="lang-switch">
      <button type="button" [class.active]="languageService.currentLang === 'en'" (click)="setLang('en')">EN</button>
      <button type="button" [class.active]="languageService.currentLang === 'vi'" (click)="setLang('vi')">VI</button>
    </div>

    <!-- Show login button when not logged in -->
    <a *ngIf="!currentUser" routerLink="/login" class="login-button">{{ 'NAV.LOGIN' | translate }}</a>
  </div>
</nav>
