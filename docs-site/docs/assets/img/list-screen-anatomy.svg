<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Annotated wireframe of the shared list screen: search, filters, refresh, table and pager">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="380" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="379" rx="6" class="line"/>

  <text class="t md bold" x="28" y="38">Manage {records}</text>
  <rect x="754" y="22" width="106" height="26" rx="5" fill="#4f46e5"/>
  <text class="t sm" x="774" y="39" fill="#ffffff">+ Add record</text>

  <!-- Toolbar -->
  <rect x="28" y="64" width="300" height="26" rx="4" class="soft"/>
  <circle cx="44" cy="77" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="48" y1="81" x2="52" y2="85" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t sm muted" x="62" y="81">Search name or email…</text>

  <rect x="342" y="64" width="140" height="26" rx="4" class="soft"/>
  <text class="t sm" x="354" y="81">All roles</text>
  <text class="t sm muted" x="462" y="81">▾</text>
  <rect x="494" y="64" width="140" height="26" rx="4" class="soft"/>
  <text class="t sm" x="506" y="81">All statuses</text>
  <text class="t sm muted" x="614" y="81">▾</text>

  <rect x="646" y="64" width="30" height="26" rx="4" class="soft"/>
  <text class="t sm" x="656" y="81">↻</text>

  <!-- Table -->
  <rect x="28" y="108" width="832" height="200" rx="5" class="line"/>
  <rect x="28" y="108" width="832" height="30" rx="5" fill="#f1f5f9"/>
  <line x1="28" y1="138" x2="860" y2="138" class="line"/>
  <g class="t sm bold">
    <text x="44" y="128">Column A</text>
    <text x="200" y="128">Column B</text>
    <text x="356" y="128">Column C</text>
    <text x="512" y="128">Column D</text>
    <text x="664" y="128">Status</text>
    <text x="762" y="128">Actions</text>
  </g>
  <rect x="486" y="112" width="170" height="22" fill="#fef3c7" opacity="0.55"/>

  <g class="t sm muted">
    <text x="44" y="160">Row one</text><text x="200" y="160">value</text><text x="356" y="160">value</text><text x="512" y="160">value</text>
    <text x="44" y="194">Row two</text><text x="200" y="194">value</text><text x="356" y="194">value</text><text x="512" y="194">value</text>
    <text x="44" y="228">Row three</text><text x="200" y="228">value</text><text x="356" y="228">value</text><text x="512" y="228">value</text>
  </g>
  <rect x="660" y="150" width="52" height="15" rx="7" fill="#dcfce7"/><text class="t sm" x="668" y="161" fill="#15803d">Active</text>
  <rect x="660" y="184" width="52" height="15" rx="7" fill="#dcfce7"/><text class="t sm" x="668" y="195" fill="#15803d">Active</text>
  <rect x="660" y="218" width="62" height="15" rx="7" fill="#e2e8f0"/><text class="t sm" x="668" y="229">Inactive</text>

  <g>
    <rect x="756" y="149" width="34" height="17" rx="4" class="soft"/><text class="t sm muted" x="764" y="161">edit</text>
    <rect x="798" y="149" width="46" height="17" rx="4" class="soft"/><text class="t sm muted" x="806" y="161">delete</text>
    <rect x="756" y="183" width="34" height="17" rx="4" class="soft"/><text class="t sm muted" x="764" y="195">edit</text>
    <rect x="756" y="217" width="34" height="17" rx="4" class="soft"/><text class="t sm muted" x="764" y="229">edit</text>
  </g>
  <line x1="28" y1="172" x2="860" y2="172" class="soft"/>
  <line x1="28" y1="206" x2="860" y2="206" class="soft"/>
  <line x1="28" y1="240" x2="860" y2="240" class="soft"/>

  <text class="t sm muted" x="44" y="284">Showing 1 to 3 of 24</text>
  <rect x="788" y="270" width="24" height="20" rx="4" class="soft"/><text class="t sm" x="797" y="284">‹</text>
  <rect x="820" y="270" width="24" height="20" rx="4" class="soft"/><text class="t sm" x="829" y="284">›</text>

  <!-- Callouts -->
  <circle class="cal" cx="14" cy="77" r="11"/><text class="caltx" x="10.5" y="81">1</text>
  <circle class="cal" cx="412" cy="54" r="11"/><text class="caltx" x="408.5" y="58">2</text>
  <circle class="cal" cx="661" cy="54" r="11"/><text class="caltx" x="657.5" y="58">3</text>
  <circle class="cal" cx="571" cy="98" r="11"/><text class="caltx" x="567.5" y="102">4</text>
  <circle class="cal" cx="821" cy="139" r="11"/><text class="caltx" x="817.5" y="143">5</text>
  <circle class="cal" cx="816" cy="256" r="11"/><text class="caltx" x="812.5" y="260">6</text>
  <circle class="cal" cx="807" cy="16" r="11"/><text class="caltx" x="803.5" y="20">7</text>

  <text class="t sm muted" x="28" y="336">Shaded column = dropped automatically on narrower screens.</text>
</svg>
