<div class="student-portal">
  <!-- Header Section -->
  <div class="container-fluid py-4">
    <div class="row align-items-center">
      <div class="col-md-6">
        <div class="welcome-section">
          <h2 class="mb-2">Welcome, {{ studentName }}!</h2>
          <p class="text-muted mb-0">Student Portal - My Applications</p>
        </div>
      </div>
      <div class="col-md-6 text-md-end">
        <button class="btn btn-primary btn-lg" (click)="onNewApplication()">
          <i class="fas fa-plus me-2"></i>New Application
        </button>
      </div>
    </div>
  </div>

  <!-- Applications Section -->
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <!-- Loading State -->
        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading applications...</p>
        </div>

        <!-- Applications Table -->
        <div *ngIf="!isLoading" class="card border shadow-sm">
          <div class="card-header bg-white py-3">
            <div class="row align-items-center">
              <div class="col-md-6">
                <h5 class="card-title mb-0">My Applications</h5>
              </div>
              <div class="col-md-6">
                <div class="d-flex gap-2">
                  <div class="input-group flex-grow-1">
                    <span class="input-group-text bg-transparent">
                      <i class="fas fa-search text-muted"></i>
                    </span>
                    <input 
                      type="text" 
                      class="form-control" 
                      placeholder="Search applications..."
                      (input)="onSearchChange($event)">
                  </div>
                  <select class="form-select" style="width: auto;" (change)="onStatusFilterChange($event)">
                    <option value="all">All Status</option>
                    <option value="Under Review">Under Review</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Documents Required">Documents Required</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          
          <div class="card-body p-0">
            <div class="table-responsive">
              <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-bordered table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <!-- <th class="border-end">Application ID</th> -->
                    <th class="border-end">Description</th>
                     <th class="border-end">Type</th>
                    <th class="border-end">Date Applied</th>
                    <th class="border-end">Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let app of filteredApplications">
                    <!-- <td class="border-end fw-bold">{{ app.id }}</td> -->
                    <td class="border-end">{{ app.description }}</td>
                    <td class="border-end">{{ app.applicationType }}</td>
                    <td class="border-end">{{ app.dateApplied | date:'mediumDate' }}</td>
                    <td class="border-end">
                      <span [class]="getStatusBadgeClass(app.status)">
                        {{ app.status }}
                      </span>
                    </td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary" (click)="viewDetails(app.id)">
                        <i class="fas fa-eye me-1"></i>View Details
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
