<div class="feedback-portal">
  <div class="container-fluid py-1">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h3 class="mb-2">Manage Students</h3>
      </div>
      <div class="col-md-6 text-md-end">
        <a class="btn btn-primary btn-sm" routerLink="/staff-portal/students/new" *ngIf="permissions.add">
          <i class="fas fa-plus me-2"></i>Add Student
        </a>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading students...</p>
        </div>

        <div *ngIf="!isLoading" class="card border shadow-sm">
          <div class="card-body p-0">
            <app-data-table [columns]="columns" [data]="students" [rowActions]="rowActions"
              [pageNumber]="pager.pageNumber" [pageSize]="pager.pageSize" [totalCount]="pager.totalCount"
              [showSearch]="true" searchPlaceholder="Search name, email, mobile or passport no..."
              (searchChange)="onSearchChange($event)" (pageChange)="onPageChange($event)"
              (actionClick)="onTableAction($event)" tableClass="table table-bordered table-hover mb-0">
              <select tableFilters class="form-select" style="max-width: 150px;"
                (change)="onActiveFilterChange($event)">
                <option value="all">All statuses</option>
                <option value="true">Active only</option>
                <option value="false">Inactive only</option>
              </select>
            </app-data-table>
            <p *ngIf="!isLoading && students.length === 0" class="text-center text-muted py-4 mb-0">
              No students yet. Click "Add Student" to create one.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
