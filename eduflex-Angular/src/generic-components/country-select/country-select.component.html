<div class="country-select">
  <p-autocomplete
    [inputId]="id"
    [ngModel]="value"
    (ngModelChange)="onModelChange($event)"
    [suggestions]="suggestions"
    (completeMethod)="search($event)"
    [dropdown]="true"
    [forceSelection]="true"
    [disabled]="disabled"
    [placeholder]="placeholder"
    (onBlur)="onBlur()"
    styleClass="w-100"
  />
</div>
