<section class="feedback-section" *ngIf="feedbacks.length > 0">
  <div class="container">
    <div class="feedback-heading">
      <h2>What our students say</h2>
      <p>Real feedback from learners who completed their journey with Eduflex</p>
    </div>

    <div class="feedback-carousel" (mouseenter)="stopFeedbackAutoplay()" (mouseleave)="restartFeedbackAutoplay()">
      <button type="button" class="feedback-arrow feedback-arrow-prev" (click)="prevFeedbackSlide(); restartFeedbackAutoplay()" aria-label="Previous feedback">&#8249;</button>

      <div class="feedback-card">
        <div class="feedback-photo" [style.background-image]="'url(' + feedbacks[currentFeedbackIndex].photoUrl + ')'">
          <div class="feedback-photo-overlay">
            <p class="feedback-name">{{ feedbacks[currentFeedbackIndex].name }}</p>
            <p class="feedback-course">{{ feedbacks[currentFeedbackIndex].courseName }}</p>
          </div>
        </div>
        <div class="feedback-comment">
          <span class="feedback-quote">&#8220;</span>
          <p>{{ feedbacks[currentFeedbackIndex].comment }}</p>
        </div>
      </div>

      <button type="button" class="feedback-arrow feedback-arrow-next" (click)="nextFeedbackSlide(); restartFeedbackAutoplay()" aria-label="Next feedback">&#8250;</button>
    </div>

    <div class="feedback-dots">
      <button
        type="button"
        *ngFor="let f of feedbacks; let i = index"
        class="feedback-dot"
        [class.active]="i === currentFeedbackIndex"
        (click)="goToFeedbackSlide(i)"
        [attr.aria-label]="'Go to feedback ' + (i + 1)">
      </button>
    </div>
  </div>
</section>
