<div class="feedback-portal">
  <div class="container-fluid py-1">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h3 class="mb-2">Manage Users</h3>
      </div>
      <div class="col-md-6 text-md-end">
        <p-button label="Add User" icon="fas fa-plus" size="small" (onClick)="openModal()" />
      </div>
    </div>
  </div>



  <div class="container-fluid">

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button type="button" class="nav-link" [class.active]="activeTab === 'Staffs'"
          (click)="switchTab('Staffs')">Staffs</button>
      </li>
      <li class="nav-item">
        <button type="button" class="nav-link" [class.active]="activeTab === 'Student'"
          (click)="switchTab('Student')">Students</button>
      </li>
      <!-- <li class="nav-item">
        <button type="button" class="nav-link" [class.active]="activeTab === 'Customer'"
          (click)="switchTab('Customer')">Customers</button>
      </li> -->

    </ul>

    <div class="row">
      <div class="col-12">
        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading users...</p>
        </div>

        <div *ngIf="!isLoading" class="card border shadow-sm">
          <div class="card-body p-0">
            <app-data-table [columns]="columns" [data]="users" [rowActions]="rowActions" [pageNumber]="pager.pageNumber"
              [pageSize]="pager.pageSize" [totalCount]="pager.totalCount" [showSearch]="true"
              searchPlaceholder="Search name or email..." (search)="onSearchChange($event)"
              (refresh)="onRefresh()" (pageChange)="onPageChange($event)" (actionClick)="onTableAction($event)"
              tableClass="table table-bordered table-hover mb-0">
              <select tableFilters class="form-select" style="max-width: 180px;" [value]="roleFilter"
                (change)="onRoleFilterChange($event)">
                <option value="">All roles</option>
                <option *ngFor="let role of visibleRoles" [value]="role.id">{{ role.name }}</option>
              </select>
              <select tableFilters class="form-select" style="max-width: 150px;" [value]="activeFilter"
                (change)="onActiveFilterChange($event)">
                <option value="all">All statuses</option>
                <option value="true">Active only</option>
                <option value="false">Inactive only</option>
              </select>
            </app-data-table>
            <p *ngIf="!isLoading && users.length === 0" class="text-center text-muted py-4 mb-0">
              No users yet. Click "Add User" to create one.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<!-- Add/Edit User Modal -->
<app-modal *ngIf="isModalOpen" [title]="editingId ? 'Edit User' : 'Add User'" [isSaving]="isSubmitting"
  [saveLabel]="editingId ? 'Save Changes' : 'Save User'" (closeModal)="closeModal()" (cancel)="closeModal()"
  (save)="onSubmit()">
  <form [formGroup]="userForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email *</label>
      <input id="email" type="email" class="form-control" formControlName="email">
      <span class="field-error" *ngIf="isFieldInvalid('email')">A valid email is required</span>
    </div>

    <div class="mb-3">
      <label for="mobile" class="form-label">Mobile *</label>
      <input id="mobile" type="tel" class="form-control" formControlName="mobile">
      <span class="field-error" *ngIf="isFieldInvalid('mobile')">Mobile is required</span>
    </div>

    <div class="mb-3" *ngIf="!editingId">
      <label for="password" class="form-label">Temporary Password *</label>
      <input id="password" type="password" class="form-control" formControlName="password">
      <span class="field-error" *ngIf="isFieldInvalid('password')">Password must be at least 6 characters</span>
      <div class="form-text">The user must change this password the first time they log in.</div>
    </div>

    <div class="mb-3">
      <label for="firstName" class="form-label">First Name *</label>
      <input id="firstName" type="text" class="form-control" formControlName="firstName">
      <span class="field-error" *ngIf="isFieldInvalid('firstName')">First name is required</span>
    </div>

    <div class="mb-3">
      <label for="middleName" class="form-label">Middle Name</label>
      <input id="middleName" type="text" class="form-control" formControlName="middleName">
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name *</label>
      <input id="lastName" type="text" class="form-control" formControlName="lastName">
      <span class="field-error" *ngIf="isFieldInvalid('lastName')">Last name is required</span>
    </div>

    <div class="mb-3">
      <label for="roleId" class="form-label">Role *</label>
      <select id="roleId" class="form-select" formControlName="roleId">
        <option value="" disabled selected>Select a role</option>
        <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
      </select>
      <span class="field-error" *ngIf="isFieldInvalid('roleId')">Role is required</span>
    </div>

    <div class="mb-3" *ngIf="editingId">
      <label class="form-check-label d-flex align-items-center gap-2">
        <input type="checkbox" class="form-check-input mt-0" formControlName="isActive">
        Active
      </label>
    </div>

    <app-notification type="error" [message]="errorMessage"></app-notification>
  </form>
</app-modal>
