<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Annotated wireframe of the task detail screen: header buttons, details and timeline">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="400" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="399" rx="6" class="line"/>

  <text class="t md bold" x="28" y="36">Chase CoE from Southbank</text>
  <rect x="238" y="24" width="62" height="16" rx="8" fill="#dbeafe"/><text class="t sm" x="246" y="36" fill="#1d4ed8">Processing</text>

  <rect x="500" y="22" width="52" height="24" rx="5" class="soft"/><text class="t sm muted" x="514" y="38">Edit</text>
  <rect x="562" y="22" width="76" height="24" rx="5" class="soft"/><text class="t sm muted" x="576" y="38">Reassign</text>
  <rect x="648" y="22" width="106" height="24" rx="5" fill="#16a34a"/><text class="t sm" x="662" y="38" fill="#ffffff">Mark Complete</text>
  <rect x="764" y="22" width="70" height="24" rx="5" class="soft"/><text class="t sm muted" x="778" y="38">Reopen</text>

  <!-- Details -->
  <rect x="28" y="62" width="470" height="308" rx="5" class="line"/>
  <text class="t sm bold" x="44" y="84">Task details</text>
  <text class="t sm" x="44" y="110">Task name *</text>
  <rect x="44" y="116" width="438" height="22" rx="4" class="soft"/>
  <text class="t sm muted" x="54" y="131">Chase CoE from Southbank</text>
  <text class="t sm" x="44" y="158">Due date/time *</text>
  <rect x="44" y="164" width="210" height="22" rx="4" class="soft"/>
  <text class="t sm muted" x="54" y="179">22/08/2026 17:00</text>
  <text class="t sm" x="44" y="206">Description</text>
  <rect x="44" y="212" width="438" height="46" rx="4" class="soft"/>

  <text class="t sm bold" x="44" y="288">Link to a record (optional)</text>
  <rect x="44" y="296" width="438" height="30" rx="4" class="soft" fill="#f8fafc"/>
  <text class="t sm" x="56" y="315">Enrolment</text>
  <text class="t sm muted" x="132" y="315">Minh Tran — Master of IT</text>
  <text class="t sm muted" x="420" y="315">(locked)</text>

  <!-- Timeline -->
  <rect x="514" y="62" width="358" height="308" rx="5" class="line"/>
  <rect x="514" y="62" width="358" height="30" rx="5" fill="#f8fafc"/>
  <line x1="514" y1="92" x2="872" y2="92" class="line"/>
  <text class="t sm bold" x="530" y="82">Timeline</text>

  <rect x="530" y="104" width="326" height="34" rx="4" class="soft"/>
  <text class="t sm muted" x="540" y="124">Add a note…</text>
  <rect x="784" y="146" width="72" height="20" rx="4" fill="#4f46e5"/>
  <text class="t sm" x="800" y="160" fill="#ffffff">Add note</text>

  <g>
    <text class="t sm muted" x="530" y="196">18/08 14:22</text>
    <rect x="608" y="185" width="86" height="14" rx="7" fill="#e0e7ff"/><text class="t sm" x="616" y="196" fill="#4338ca">Status Change</text>
    <text class="t sm" x="530" y="212">Jo Diaz — New → Processing</text>
    <line x1="530" y1="224" x2="856" y2="224" class="soft"/>

    <text class="t sm muted" x="530" y="248">17/08 09:05</text>
    <rect x="608" y="237" width="60" height="14" rx="7" fill="#e0e7ff"/><text class="t sm" x="616" y="248" fill="#4338ca">Reassign</text>
    <text class="t sm" x="530" y="264">Sarah Chen → Jo Diaz</text>
    <text class="t sm muted" x="530" y="280">"Jo is handling Southbank this month."</text>
    <line x1="530" y1="292" x2="856" y2="292" class="soft"/>

    <text class="t sm muted" x="530" y="316">16/08 11:40</text>
    <rect x="608" y="305" width="40" height="14" rx="7" fill="#e2e8f0"/><text class="t sm" x="616" y="316">Note</text>
    <text class="t sm" x="530" y="332">Sarah Chen — Called admissions, no answer.</text>
  </g>

  <!-- Callouts -->
  <circle class="cal" cx="478" cy="34" r="11"/><text class="caltx" x="474.5" y="38">1</text>
  <circle class="cal" cx="14" cy="127" r="11"/><text class="caltx" x="10.5" y="131">2</text>
  <circle class="cal" cx="14" cy="311" r="11"/><text class="caltx" x="10.5" y="315">3</text>
  <circle class="cal" cx="500" cy="120" r="11"/><text class="caltx" x="496.5" y="124">4</text>
  <circle class="cal" cx="500" cy="250" r="11"/><text class="caltx" x="496.5" y="254">5</text>
</svg>
