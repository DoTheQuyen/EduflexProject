<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Annotated wireframe of a migration case process step: fields, evidence, tips and step buttons">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .req   { fill: #dc2626; }
  </style>

  <rect x="0" y="0" width="900" height="420" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="419" rx="6" class="line"/>

  <!-- Tab bar -->
  <line x1="0" y1="42" x2="900" y2="42" class="line"/>
  <g class="t sm muted">
    <text x="30" y="28">Customer Info</text>
  </g>
  <text class="t sm bold" x="132" y="28">Process</text>
  <line x1="126" y1="42" x2="186" y2="42" stroke="#4f46e5" stroke-width="2"/>
  <g class="t sm muted">
    <text x="204" y="28">Documents</text><text x="288" y="28">Communication</text>
    <text x="398" y="28">Forms</text><text x="454" y="28">Tasks</text><text x="510" y="28">Audit Trail</text>
  </g>

  <!-- Completed step -->
  <rect x="28" y="58" width="832" height="30" rx="5" class="soft" fill="#f8fafc"/>
  <text class="t sm bold" x="48" y="77">Apply for Offer</text>
  <rect x="762" y="66" width="62" height="16" rx="8" fill="#dcfce7"/><text class="t sm" x="770" y="78" fill="#15803d">Complete</text>

  <!-- Open step -->
  <rect x="28" y="96" width="832" height="270" rx="5" class="line" stroke="#4f46e5"/>
  <rect x="28" y="96" width="832" height="30" rx="5" fill="#eef2ff"/>
  <text class="t sm bold" x="48" y="115">Lodge Visa Application</text>
  <rect x="778" y="104" width="46" height="16" rx="8" fill="#fef3c7"/><text class="t sm" x="786" y="116" fill="#92400e">Draft</text>

  <!-- Fields -->
  <text class="t sm bold" x="48" y="148">Lodgement date <tspan class="req">*</tspan></text>
  <rect x="48" y="154" width="180" height="22" rx="4" class="soft"/>
  <text class="t sm bold" x="248" y="148">Subclass <tspan class="req">*</tspan></text>
  <rect x="248" y="154" width="180" height="22" rx="4" class="soft"/>
  <text class="t sm" x="258" y="169">500</text><text class="t sm muted" x="410" y="169">▾</text>
  <text class="t sm bold" x="448" y="148">Biometrics done</text>
  <rect x="448" y="154" width="180" height="22" rx="4" class="soft"/>
  <text class="t sm muted" x="458" y="169">Yes / No</text><text class="t sm muted" x="610" y="169">▾</text>

  <!-- Evidence -->
  <text class="t sm bold" x="48" y="204">Evidence — VisaLodgement</text>
  <rect x="48" y="212" width="792" height="52" rx="4" class="soft" fill="#f8fafc"/>
  <rect x="62" y="224" width="96" height="22" rx="4" class="soft" fill="#ffffff" stroke="#4f46e5"/>
  <text class="t sm" x="74" y="239" fill="#4f46e5">Upload file</text>
  <text class="t sm muted" x="176" y="239">No document uploaded yet.</text>

  <!-- Tips -->
  <rect x="48" y="278" width="234" height="22" rx="4" class="soft" fill="#fffbeb" stroke="#fcd34d"/>
  <text class="t sm" x="60" y="293" fill="#92400e">💡 Tips from the team (2)</text>

  <!-- Buttons -->
  <rect x="524" y="326" width="82" height="24" rx="5" class="soft"/><text class="t sm muted" x="536" y="342">Save Draft</text>
  <rect x="616" y="326" width="88" height="24" rx="5" fill="#c7d2fe"/><text class="t sm" x="636" y="342" fill="#4f46e5">Complete</text>
  <rect x="714" y="326" width="74" height="24" rx="5" class="soft"/><text class="t sm muted" x="730" y="342">Reopen</text>

  <text class="t sm muted" x="48" y="342">Complete is blocked until fields, evidence and preconditions are satisfied.</text>

  <!-- Later step -->
  <rect x="28" y="376" width="832" height="30" rx="5" class="soft"/>
  <text class="t sm muted" x="48" y="395">Visa Decision</text>
  <rect x="778" y="384" width="46" height="16" rx="8" fill="#e2e8f0"/><text class="t sm muted" x="786" y="396">Draft</text>

  <!-- Callouts -->
  <circle class="cal" cx="14" cy="112" r="11"/><text class="caltx" x="10.5" y="116">1</text>
  <circle class="cal" cx="14" cy="163" r="11"/><text class="caltx" x="10.5" y="167">2</text>
  <circle class="cal" cx="14" cy="234" r="11"/><text class="caltx" x="10.5" y="238">3</text>
  <circle class="cal" cx="14" cy="289" r="11"/><text class="caltx" x="10.5" y="293">4</text>
  <circle class="cal" cx="878" cy="338" r="11"/><text class="caltx" x="874.5" y="342">5</text>
</svg>
