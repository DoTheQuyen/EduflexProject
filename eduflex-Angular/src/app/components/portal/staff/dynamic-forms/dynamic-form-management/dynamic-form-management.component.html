<div class="dynamic-form-management-portal">
  <div class="container-fluid py-1">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="mb-1">Dynamic Forms</h3>
      </div>
      <div class="col-auto" *ngIf="permissions.add">
        <button type="button" class="btn btn-md btn-primary" (click)="createNew()">
          <i class="fas fa-plus me-1"></i>New Form
        </button>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2">Loading forms...</p>
    </div>

    <div *ngIf="!isLoading" class="card border shadow-sm">
      <div class="card-body p-0">
        <app-data-table [columns]="columns" [data]="templates" [rowActions]="rowActions" [totalCount]="templates.length"
          [showSearch]="false" (actionClick)="onTableAction($event)" tableClass="table table-bordered table-hover mb-0">
        </app-data-table>
        <p *ngIf="!isLoading && templates.length === 0" class="text-center text-muted py-4 mb-0">
          No dynamic forms yet — click "New Form" to create one.
        </p>
      </div>
    </div>
  </div>
</div>
