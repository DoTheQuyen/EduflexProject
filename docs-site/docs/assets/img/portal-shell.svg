<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Annotated wireframe of the Eduflex portal shell: sidebar, header and content area">
  <style>
    .bg    { fill: #ffffff; }
    .chrome{ fill: #f8fafc; }
    .side  { fill: #1e293b; }
    .bar   { fill: #e2e8f0; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .tw    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e2e8f0; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 12.5px; }
    .bold  { font-weight: 600; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .accent{ fill: #4f46e5; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="460" rx="6"/>
  <rect x="0.5" y="0.5" width="899" height="459" rx="6" class="line"/>

  <!-- Sidebar -->
  <rect class="side" x="1" y="1" width="196" height="458" rx="6"/>
  <rect class="side" x="150" y="1" width="47" height="458"/>
  <text class="tw md bold" x="20" y="34">Eduflex</text>
  <rect x="168" y="24" width="16" height="14" rx="3" fill="#475569"/>

  <g class="tw sm">
    <text x="20" y="72">Dashboard</text>
    <text x="20" y="100">Enquiry</text>
    <text x="20" y="128">Academic</text>
    <text x="34" y="152" class="muted">Courses</text>
    <text x="34" y="174" class="muted">Applications</text>
    <text x="34" y="196" class="muted">Enrolments</text>
    <text x="34" y="218" class="muted">Students</text>
    <text x="20" y="246">Migration Cases</text>
    <text x="20" y="274">Tasks</text>
    <text x="20" y="302">Partners</text>
    <text x="20" y="330">Finance</text>
    <text x="20" y="358">Marketing</text>
    <text x="20" y="386">Template</text>
    <text x="20" y="414">Administration</text>
    <text x="20" y="442">Profile</text>
  </g>
  <rect x="10" y="112" width="177" height="22" rx="4" fill="#334155"/>
  <text class="tw sm" x="20" y="128">Academic</text>

  <!-- Header -->
  <rect class="chrome" x="197" y="1" width="702" height="44"/>
  <line x1="197" y1="45" x2="899" y2="45" class="line"/>
  <text class="t sm muted" x="216" y="28">Staff Portal</text>
  <text class="t sm muted" x="284" y="28">&#8250;</text>
  <text class="t sm bold" x="298" y="28">Applications</text>

  <circle cx="712" cy="23" r="11" fill="#e2e8f0"/>
  <text class="t sm bold" x="708" y="27">?</text>
  <circle cx="748" cy="23" r="11" fill="#e2e8f0"/>
  <text class="t sm" x="744" y="27">&#9788;</text>
  <text class="t sm muted" x="768" y="27">Welcome, Sarah</text>
  <rect x="854" y="12" width="34" height="22" rx="4" fill="none" stroke="#dc2626"/>
  <text class="t sm" x="860" y="27" fill="#dc2626">exit</text>

  <!-- Content -->
  <rect class="bg" x="197" y="45" width="702" height="414"/>
  <rect class="bar" x="228" y="80" width="240" height="16" rx="4"/>
  <rect class="bar" x="228" y="112" width="640" height="1"/>
  <rect x="228" y="132" width="640" height="120" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="228" y="272" width="640" height="120" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t sm muted" x="248" y="196">content area</text>

  <!-- Callouts -->
  <g>
    <circle class="cal" cx="118" cy="128" r="11"/><text class="caltx" x="114.5" y="132">1</text>
    <circle class="cal" cx="176" cy="31" r="11"/><text class="caltx" x="172.5" y="35">2</text>
    <circle class="cal" cx="360" cy="52" r="11"/><text class="caltx" x="356.5" y="56">3</text>
    <circle class="cal" cx="712" cy="47" r="11"/><text class="caltx" x="708.5" y="51">4</text>
    <circle class="cal" cx="748" cy="47" r="11"/><text class="caltx" x="744.5" y="51">5</text>
    <circle class="cal" cx="871" cy="47" r="11"/><text class="caltx" x="867.5" y="51">6</text>
  </g>
  <line x1="360" y1="41" x2="360" y2="34" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="712" y1="36" x2="712" y2="33" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="748" y1="36" x2="748" y2="33" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="871" y1="36" x2="871" y2="33" stroke="#ea580c" stroke-width="1.5"/>
</svg>
