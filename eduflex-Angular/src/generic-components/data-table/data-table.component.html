<div class="data-table-toolbar d-flex flex-wrap align-items-center gap-2 mb-3" *ngIf="showSearch">
  <div class="input-group" style="max-width: 360px;">
    <span class="input-group-text bg-transparent"><i class="fas fa-search text-muted"></i></span>
    <input #searchInputEl type="text" class="form-control" [placeholder]="searchPlaceholder"
      (keydown.enter)="onSearchClick()">
    <button type="button" class="btn btn-outline-secondary" (click)="onSearchClick()">Search</button>
  </div>
  <ng-content select="[tableFilters]"></ng-content>
  <button type="button" class="btn btn-outline-secondary ms-auto" (click)="onRefreshClick()">
    <i class="fas fa-arrows-rotate"></i> Refresh
  </button>
</div>

<div class="table-responsive">
  <p-table
    [value]="sortedData"
    [lazy]="true"
    [paginator]="totalCount > pageSize"
    [rows]="pageSize"
    [first]="first"
    [totalRecords]="totalCount"
    (onLazyLoad)="onLazyLoad($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
    [showGridlines]="true"
    [resizableColumns]="true"
    [stripedRows]="true"
    [scrollable]="true"
  >
    <ng-template #header>
      <tr>
        <th *ngFor="let col of columns" [ngClass]="[col.className || '', hideClass(col)]"
          [style.min-width]="col.minWidth || '120px'" pResizableColumn
          [pSortableColumn]="isSortable(col) ? fieldName(col) : undefined">
          {{ col.title }}
          <p-sortIcon *ngIf="isSortable(col)" [field]="fieldName(col)" />
        </th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td *ngFor="let col of columns" [ngClass]="[col.className || '', hideClass(col)]">

          <!-- Status column -->
          <ng-container *ngIf="col.field === 'status'; else notStatus">
            <span class="badge" [ngClass]="getStatusBadgeClass(getCellData(row, col.field, col.formatter))">
              {{ getCellData(row, col.field, col.formatter) }}
            </span>
          </ng-container>

          <!-- Actions column -->
          <ng-template #notStatus>
            <ng-container *ngIf="col.field === 'actions'; else defaultCell">
              <div class="row-actions">
                <ng-container *ngFor="let ra of rowActions">
                  <button *ngIf="!ra.isVisible || ra.isVisible(row)"
                    [ngClass]="ra.cssClass || 'btn btn-sm btn-outline-primary'"
                    (click)="actionClick.emit({ action: ra.action, row })">
                    <i *ngIf="ra.icon" class="fas {{ ra.icon }} me-1"></i>{{ ra.label }}
                  </button>
                </ng-container>
              </div>
            </ng-container>
          </ng-template>

          <!-- Default cell -->
          <ng-template #defaultCell>
            <span *ngIf="col.render; else plainText" [innerHTML]="col.render(getCellData(row, col.field), row)"></span>
            <ng-template #plainText>{{ getCellData(row, col.field, col.formatter) }}</ng-template>
          </ng-template>

        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
