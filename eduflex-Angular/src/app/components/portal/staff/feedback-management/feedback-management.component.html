<div class="feedback-portal">
  <div class="container-fluid py-4">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h2 class="mb-2">Manage Student Feedback</h2>
      </div>
      <div class="col-md-6 text-md-end">
        <button class="btn btn-primary btn-lg" (click)="openModal()">
          <i class="fas fa-plus me-2"></i>Add Feedback
        </button>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading feedback...</p>
        </div>

        <div *ngIf="!isLoading" class="card border shadow-sm">
         
          <div class="card-body p-0">
            <app-data-table
              [columns]="columns"
              [data]="feedbacks"
              [rowActions]="rowActions"
              [pageNumber]="pageNumber"
              [pageSize]="pageSize"
              [totalCount]="totalCount"
              (pageChange)="onPageChange($event)"
              (actionClick)="onTableAction($event)"
              tableClass="table table-bordered table-hover mb-0">
            </app-data-table>
            <p *ngIf="!isLoading && feedbacks.length === 0" class="text-center text-muted py-4 mb-0">
              No feedback yet. Click "Add Feedback" to create one.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Feedback Modal -->
<app-modal *ngIf="isModalOpen" title="Add Student Feedback" [isSaving]="isSubmitting"
  saveLabel="Save Feedback"
  (closeModal)="closeModal()" (cancel)="closeModal()" (save)="onSubmit()">
  <form [formGroup]="feedbackForm">
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="feedback-avatar-preview">
        <img *ngIf="photoPreview" [src]="photoPreview" alt="Preview">
        <i *ngIf="!photoPreview" class="fas fa-image text-muted"></i>
      </div>
      <div class="flex-grow-1">
        <label for="photoFile" class="form-label">Photo *</label>
        <input id="photoFile" type="file" accept="image/*" class="form-control" (change)="onPhotoSelected($event)">
        <span class="field-error" *ngIf="isFieldInvalid('photoData')">Photo is required</span>
        <div class="form-text">Resized automatically to 300×300px JPEG before saving.</div>
      </div>
    </div>

    <div class="mb-3">
      <label for="name" class="form-label">Name *</label>
      <input id="name" type="text" class="form-control" formControlName="name">
      <span class="field-error" *ngIf="isFieldInvalid('name')">Name is required</span>
    </div>

    <div class="mb-3">
      <label for="courseName" class="form-label">Course Name *</label>
      <input id="courseName" type="text" class="form-control" formControlName="courseName">
      <span class="field-error" *ngIf="isFieldInvalid('courseName')">Course name is required</span>
    </div>

    <div class="mb-3">
      <label for="comment" class="form-label">Comment *</label>
      <textarea id="comment" rows="3" class="form-control" formControlName="comment"></textarea>
      <span class="field-error" *ngIf="isFieldInvalid('comment')">Comment is required</span>
    </div>

    <app-notification type="error" [message]="errorMessage"></app-notification>
  </form>
</app-modal>
