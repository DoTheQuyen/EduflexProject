<div class="modal-backdrop-generic">
  <div class="modal-panel-generic" [ngClass]="'modal-' + size" (click)="$event.stopPropagation()">

    <div class="modal-header-generic">
      <h5 class="modal-title-generic">{{ title }}</h5>
      <button type="button" class="modal-close-generic" (click)="onCloseClick()" aria-label="Close">&times;</button>
    </div>

    <fieldset [disabled]="isSaving" class="modal-body-generic">
      <ng-content></ng-content>
    </fieldset>

    <div class="modal-footer-generic">
      <button *ngIf="showDelete" type="button" class="btn btn-outline-danger" [disabled]="isSaving" (click)="onDeleteClick()">
        <i class="fas fa-trash me-1"></i>{{ deleteLabel }}
      </button>
      <button *ngIf="showCancel" type="button" class="btn btn-outline-secondary" [disabled]="isSaving" (click)="onCancelClick()">
        {{ cancelLabel }}
      </button>
      <button *ngIf="showUpdate" type="button" class="btn btn-primary" [disabled]="isSaving || saveDisabled" (click)="onUpdateClick()">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>{{ isSaving ? savingLabel : updateLabel }}
      </button>
      <button *ngIf="showSave" type="button" class="btn btn-primary" [disabled]="isSaving || saveDisabled" (click)="onSaveClick()">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>{{ isSaving ? savingLabel : saveLabel }}
      </button>
    </div>

    <div class="confirm-overlay-generic" *ngIf="pendingAction">
      <div class="confirm-box-generic">
        <p class="confirm-message-generic">{{ pendingMessage }}</p>
        <div class="confirm-actions-generic">
          <button type="button" class="btn btn-outline-secondary" (click)="cancelPendingAction()">Cancel</button>
          <button type="button" class="btn btn-primary" (click)="confirmPendingAction()">OK</button>
        </div>
      </div>
    </div>

  </div>
</div>
