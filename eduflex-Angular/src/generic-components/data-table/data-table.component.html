<div class="data-table-toolbar d-flex flex-wrap align-items-center gap-2 mb-3" *ngIf="showSearch">
  <div class="input-group" style="max-width: 320px;">
    <span class="input-group-text bg-transparent"><i class="fas fa-search text-muted"></i></span>
    <input type="text" class="form-control" [placeholder]="searchPlaceholder" (input)="onSearchInput($event)">
  </div>
  <ng-content select="[tableFilters]"></ng-content>
</div>

<div class="table-responsive">
  <table [class]="tableClass">
    <thead>
      <tr>
        <th *ngFor="let col of columns" [ngClass]="col.className">
          {{ col.title }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of data">
        <td *ngFor="let col of columns" [ngClass]="col.className">

          <!-- Status column -->
          <ng-container *ngIf="col.field === 'status'; else notStatus">
            <span class="badge" [ngClass]="getStatusBadgeClass(getCellData(row, col.field, col.formatter))">
              {{ getCellData(row, col.field, col.formatter) }}
            </span>
          </ng-container>

          <!-- Actions column -->
          <ng-template #notStatus>
            <ng-container *ngIf="col.field === 'actions'; else defaultCell">
              <div class="row-actions">
                <ng-container *ngFor="let ra of rowActions">
                  <button *ngIf="!ra.isVisible || ra.isVisible(row)" [ngClass]="ra.cssClass || 'btn btn-sm btn-outline-primary'"
                    (click)="actionClick.emit({ action: ra.action, row })">
                    <i *ngIf="ra.icon" class="fas {{ ra.icon }} me-1"></i>{{ ra.label }}
                  </button>
                </ng-container>
              </div>
            </ng-container>
          </ng-template>

          <!-- Default cell -->
          <ng-template #defaultCell>
            <span *ngIf="col.render; else plainText" [innerHTML]="col.render(getCellData(row, col.field), row)"></span>
            <ng-template #plainText>{{ getCellData(row, col.field, col.formatter) }}</ng-template>
          </ng-template>

        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="data-table-pager d-flex justify-content-between align-items-center" *ngIf="totalCount > 0">
  <span class="text-muted small">
    Showing {{ rangeStart }}&ndash;{{ rangeEnd }} of {{ totalCount }}
  </span>
  <nav aria-label="Table pagination">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="pageNumber === 1">
        <button type="button" class="page-link" (click)="goToPage(pageNumber - 1)">Previous</button>
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ pageNumber }} of {{ totalPages }}</span>
      </li>
      <li class="page-item" [class.disabled]="pageNumber === totalPages">
        <button type="button" class="page-link" (click)="goToPage(pageNumber + 1)">Next</button>
      </li>
    </ul>
  </nav>
</div>
