<nav
  class="sidebar-nav-3d fixed inset-y-0 left-0 z-[1000] flex h-screen flex-col overflow-y-auto font-sans transition-[width] duration-300 ease-in-out"
  [class.w-56]="!isCollapsed" [class.w-16]="isCollapsed"
  [attr.aria-label]="(userInfo?.role === 'Student' ? 'Student Portal' : 'Staff Portal') + ' navigation'">

  <!-- Brand -->
  <div class="sidebar-brand-divider flex items-center gap-3 px-3 py-2" [class.justify-center]="isCollapsed">
    <img src="assets/logo/browserLogo.png" alt="Eduflex logo" class="h-[60px] w-auto shrink-0 logo" />
    <span *ngIf="!isCollapsed" class="text-[25px] font-semibold tracking-wide">Eduflex</span>
  </div>

  <!-- Section label + collapse toggle -->
  <div class="flex items-center justify-between gap-1 px-2 py-1" [class.justify-center]="isCollapsed">
    <span *ngIf="!isCollapsed" class="sidebar-portal-label text-[15px] font-medium uppercase tracking-wide">
      {{ userInfo?.role === 'Student' ? 'Student Portal' : 'Staff Portal' }}
    </span>
    <button type="button" class="sidebar-collapse-btn" (click)="onToggleClick()"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <i class="fas text-[11px]" [class.fa-chevron-left]="!isCollapsed" [class.fa-chevron-right]="isCollapsed" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Menu -->
  <ul class="flex w-full flex-1 flex-col gap-1 p-1" *ngIf="(moduleCounts$ | async) as counts">
    <li *ngFor="let item of menuItems">

      <!-- Leaf item -->
      <a *ngIf="!item.children" [routerLink]="item.route" routerLinkActive #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: false }"
        class="sidebar-nav-item flex items-center gap-2 rounded-lg px-2 py-1 text-md no-underline!"
        [ngClass]="rla.isActive
          ? 'sidebar-item-active font-medium'
          : 'sidebar-item-idle font-normal'"
        [class.justify-center]="isCollapsed">
        <span class="sidebar-icon-badge">
          <i class="fas fa-{{item.icon}} text-[13px]" aria-hidden="true"></i>
          <span *ngIf="isCollapsed && itemCount(item, counts) > 0" class="sidebar-badge-dot"></span>
        </span>
        <span *ngIf="!isCollapsed" class="flex-1">{{ item.title }}</span>
        <span *ngIf="!isCollapsed && itemCount(item, counts) > 0" class="sidebar-badge">{{ itemCount(item, counts) > 9 ? '9+' : itemCount(item, counts) }}</span>
      </a>

      <!-- Group header -->
      <button *ngIf="item.children" type="button"
        class="sidebar-group-header sidebar-nav-item flex w-full appearance-none items-center gap-2 rounded-lg border-0 bg-transparent px-2 text-md sidebar-item-idle font-normal"
        [class.justify-center]="isCollapsed" (click)="onGroupHeaderClick(item)">
        <span class="sidebar-icon-badge">
          <i class="fas fa-{{item.icon}} text-[13px]" aria-hidden="true"></i>
          <span *ngIf="isCollapsed && itemCount(item, counts) > 0" class="sidebar-badge-dot"></span>
        </span>
        <span *ngIf="!isCollapsed" class="flex-1 text-left">{{ item.title }}</span>
        <span *ngIf="!isCollapsed && itemCount(item, counts) > 0" class="sidebar-badge">{{ itemCount(item, counts) > 9 ? '9+' : itemCount(item, counts) }}</span>
        <i *ngIf="!isCollapsed" class="fas sidebar-group-chevron text-[11px]" [class.fa-chevron-down]="item.expanded"
          [class.fa-chevron-right]="!item.expanded" aria-hidden="true"></i>
      </button>

      <!-- Group children -->
      <ul *ngIf="item.children && item.expanded && !isCollapsed" class="flex list-none flex-col gap-1 py-1"
        [class.pl-2]="!isCollapsed">
        <li *ngFor="let child of item.children">
          <a [routerLink]="child.route" routerLinkActive #crla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: false }"
            class="sidebar-nav-item flex items-center gap-2 rounded-lg px-1 py-1 text-md no-underline!"
            [ngClass]="crla.isActive
              ? 'sidebar-item-active font-medium'
              : 'sidebar-item-idle font-normal'"
            [class.justify-center]="isCollapsed">
            <span class="sidebar-icon-badge">
              <i class="fas fa-{{child.icon}} text-[13px]" aria-hidden="true"></i>
            </span>
            <span *ngIf="!isCollapsed" class="flex-1">{{ child.title }}</span>
            <span *ngIf="!isCollapsed && itemCount(child, counts) > 0" class="sidebar-badge">{{ itemCount(child, counts) > 9 ? '9+' : itemCount(child, counts) }}</span>
          </a>
        </li>
      </ul>
    </li>
  </ul>
</nav>
