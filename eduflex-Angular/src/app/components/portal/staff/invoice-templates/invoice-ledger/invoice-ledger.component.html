<div class="invoice-ledger-portal">
  <div class="container-fluid py-1">
    <button type="button" class="back-link" (click)="goBack()">
      <span class="back-arrow">&larr;</span> Back to Invoice Templates
    </button>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
      <div>
        <h3 class="mb-1">Sent Invoices</h3>
        <p class="text-muted mb-0">Every invoice ever sent through the Invoice Template system, in issue order.</p>
      </div>
    </div>

    <div class="d-flex gap-2 mb-3 align-items-center">
      <select class="form-select form-select-sm w-auto" [(ngModel)]="categoryFilter" (ngModelChange)="onFilterChange()">
        <option value="">All categories</option>
        <option value="Customer">Customer</option>
        <option value="Partner">Partner</option>
        <option value="Custom">Custom</option>
      </select>
      <select class="form-select form-select-sm w-auto" [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()">
        <option value="">All statuses</option>
        <option value="Sent">Sent</option>
        <option value="Paid">Paid</option>
        <option value="Failed">Failed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <p-button label="Refresh" icon="fas fa-arrows-rotate" size="small" severity="secondary" [outlined]="true"
        styleClass="ms-auto" (onClick)="onRefresh()" />
    </div>

    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div *ngIf="!isLoading" class="card border shadow-sm">
      <div class="card-body p-0">
        <app-data-table
          [columns]="columns"
          [data]="invoices"
          [rowActions]="rowActions"
          [pageNumber]="pager.pageNumber"
          [pageSize]="pager.pageSize"
          [totalCount]="pager.totalCount"
          (pageChange)="onPageChange($event)"
          (actionClick)="onTableAction($event)"
          tableClass="table table-hover mb-0">
        </app-data-table>
        <p *ngIf="invoices.length === 0" class="text-center text-muted py-4 mb-0">No invoices sent yet.</p>
      </div>
    </div>
  </div>
</div>
