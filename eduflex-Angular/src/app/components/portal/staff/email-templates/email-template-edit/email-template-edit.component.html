<div class="email-template-edit-portal">
  <div class="container-fluid py-1">
    <button type="button" class="back-link" (click)="goBack()">
      <span class="back-arrow">&larr;</span> Back
    </button>

    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div *ngIf="!isLoading">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div>
          <h3 class="mb-1">{{ isEditMode ? 'Edit Email Template' : 'New Email Template' }}</h3>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="goBack()"
            [disabled]="isSaving">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm" (click)="save()" [disabled]="isSaving">
            {{ isSaving ? 'Saving...' : 'Save Template' }}
          </button>
        </div>
      </div>

      <div class="card border shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Key <span class="text-muted small">(used by the system to find this
                  template)</span></label>
              <input type="text" class="form-control" [(ngModel)]="key" [disabled]="isEditMode"
                placeholder="e.g. welcome-email" />
              <span *ngIf="isEditMode" class="text-muted small d-block mt-1">Key can't be changed after creation.</span>
              <span *ngIf="isSystemDefault" class="badge-pill badge-pill-navy-soft mt-1 d-inline-block">System
                default</span>
            </div>
            <div class="col-md-8">
              <label class="form-label">Template name</label>
              <input type="text" class="form-control" [(ngModel)]="name" placeholder="e.g. Welcome & login details" />
            </div>
            <div class="col-12">
              <label class="form-label">Subject line</label>
              <input type="text" class="form-control" [(ngModel)]="subject"
                placeholder="e.g. Welcome to Eduflex — your login details" />
            </div>
          </div>
        </div>
      </div>

      <div class="card border shadow-sm">
        <div class="card-body">
          <label class="form-label">Body</label>
          <p class="text-muted small mb-2">
            Use <code>{{ '{{studentFirstName}}' }}</code>-style placeholders — the sending flow fills these in when the
            email goes out.
          </p>
          <quill-editor [(ngModel)]="body" [modules]="quillModules" format="html" [sanitize]="true"
            placeholder="Write the email body here...">
          </quill-editor>
        </div>
      </div>
    </div>
  </div>
</div>
