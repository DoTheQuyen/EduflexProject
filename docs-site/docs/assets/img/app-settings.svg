<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Annotated wireframe of App Settings: six tabs, upload limit fields and the per-tab save button">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .req   { fill: #dc2626; }
  </style>

  <rect x="0" y="0" width="900" height="380" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="379" rx="6" class="line"/>

  <text class="t md bold" x="28" y="36">App Settings</text>

  <!-- Tabs -->
  <line x1="28" y1="76" x2="872" y2="76" class="line"/>
  <g class="t sm muted">
    <text x="34" y="68">General</text>
  </g>
  <text class="t sm bold" x="106" y="68">Application Documents</text>
  <line x1="100" y1="76" x2="242" y2="76" stroke="#4f46e5" stroke-width="2"/>
  <g class="t sm muted">
    <text x="260" y="68">Images</text>
    <text x="322" y="68">Contracts</text>
    <text x="398" y="68">Enrolment Documents</text>
    <text x="536" y="68">Chat Assistant</text>
  </g>

  <!-- Section 1 -->
  <text class="t sm bold" x="28" y="102">Application form uploads — default</text>
  <text class="t sm" x="28" y="128">Max file size (MB) <tspan class="req">*</tspan></text>
  <rect x="28" y="134" width="130" height="22" rx="4" class="soft"/><text class="t sm" x="38" y="149">5</text>
  <text class="t sm" x="178" y="128">Max files <tspan class="req">*</tspan></text>
  <rect x="178" y="134" width="130" height="22" rx="4" class="soft"/><text class="t sm" x="188" y="149">1</text>
  <text class="t sm" x="328" y="128">Allowed file extensions <tspan class="req">*</tspan></text>
  <rect x="328" y="134" width="180" height="22" rx="4" class="soft"/>
  <text class="t sm muted" x="338" y="149">e.g. .pdf</text>
  <rect x="516" y="134" width="46" height="22" rx="4" class="soft" stroke="#4f46e5"/>
  <text class="t sm" x="528" y="149" fill="#4f46e5">Add</text>

  <g>
    <rect x="328" y="164" width="54" height="18" rx="9" fill="#e0e7ff"/><text class="t sm" x="336" y="177" fill="#4338ca">.pdf ×</text>
    <rect x="390" y="164" width="54" height="18" rx="9" fill="#e0e7ff"/><text class="t sm" x="398" y="177" fill="#4338ca">.jpg ×</text>
    <rect x="452" y="164" width="60" height="18" rx="9" fill="#e0e7ff"/><text class="t sm" x="460" y="177" fill="#4338ca">.jpeg ×</text>
    <rect x="520" y="164" width="56" height="18" rx="9" fill="#e0e7ff"/><text class="t sm" x="528" y="177" fill="#4338ca">.png ×</text>
  </g>

  <!-- Section 2 -->
  <text class="t sm bold" x="28" y="216">Application form uploads — other supporting documents</text>
  <text class="t sm" x="28" y="242">Max file size (MB) <tspan class="req">*</tspan></text>
  <rect x="28" y="248" width="130" height="22" rx="4" class="soft"/><text class="t sm" x="38" y="263">10</text>
  <text class="t sm" x="178" y="242">Max files <tspan class="req">*</tspan></text>
  <rect x="178" y="248" width="130" height="22" rx="4" class="soft"/><text class="t sm" x="188" y="263">4</text>
  <text class="t sm" x="328" y="242">Allowed file extensions <tspan class="req">*</tspan></text>
  <rect x="328" y="248" width="180" height="22" rx="4" class="soft"/>
  <rect x="516" y="248" width="46" height="22" rx="4" class="soft" stroke="#4f46e5"/>
  <text class="t sm" x="528" y="263" fill="#4f46e5">Add</text>

  <!-- Save -->
  <line x1="28" y1="304" x2="872" y2="304" class="soft"/>
  <rect x="758" y="316" width="114" height="26" rx="5" fill="#4f46e5"/>
  <text class="t sm" x="776" y="333" fill="#ffffff">Save this tab</text>
  <text class="t sm muted" x="28" y="333">Saves only the tab you are on.</text>

  <!-- Callouts -->
  <circle class="cal" cx="171" cy="88" r="11"/><text class="caltx" x="167.5" y="92">1</text>
  <circle class="cal" cx="14" cy="145" r="11"/><text class="caltx" x="10.5" y="149">2</text>
  <circle class="cal" cx="588" cy="145" r="11"/><text class="caltx" x="584.5" y="149">3</text>
  <circle class="cal" cx="14" cy="216" r="11"/><text class="caltx" x="10.5" y="220">4</text>
  <circle class="cal" cx="736" cy="329" r="11"/><text class="caltx" x="732.5" y="333">5</text>
</svg>
