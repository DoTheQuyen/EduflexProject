<div class="feedback-portal">
  <div class="container-fluid py-1">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h3 class="mb-2">Add Student</h3>
      </div>
      <div class="col-md-6 text-md-end">
        <button class="btn btn-outline-secondary btn-sm" (click)="goBack()">
          <i class="fas fa-arrow-left me-2"></i>Back to Students
        </button>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card border shadow-sm">
          <div class="card-body">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
              <app-student-details-form [formGroup]="form"></app-student-details-form>

              <div class="alert alert-warning" *ngIf="duplicateWarning">
                <p class="mb-2" *ngIf="duplicateWarning.existingIsActive">
                  An active student already exists with this {{ duplicateWarning.matchedField }}. Choose different
                  details, or cancel.
                </p>
                <p class="mb-2" *ngIf="!duplicateWarning.existingIsActive">
                  An inactive (archived) student already exists with this {{ duplicateWarning.matchedField }}.
                  Reactivate that record instead of creating a new one?
                </p>
                <div class="d-flex gap-2">
                  <button type="button" class="btn btn-sm btn-warning" *ngIf="!duplicateWarning.existingIsActive"
                    [disabled]="isSubmitting" (click)="reactivateFromDuplicate()">
                    Reactivate Existing Student
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-secondary" (click)="dismissDuplicateWarning()">
                    Change Details
                  </button>
                </div>
              </div>

              <app-notification type="error" [message]="errorMessage"></app-notification>

              <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary" [disabled]="isSubmitting || !!duplicateWarning">
                  {{ isSubmitting ? 'Saving...' : 'Save Student' }}
                </button>
                <button type="button" class="btn btn-outline-secondary" (click)="goBack()" [disabled]="isSubmitting">
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
