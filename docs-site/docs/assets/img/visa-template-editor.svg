<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Annotated wireframe of the visa process template editor: step identity, fields, evidence, preconditions and hints">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="460" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="459" rx="6" class="line"/>

  <text class="t sm muted" x="28" y="26">← Back</text>
  <text class="t md bold" x="28" y="50">New Process Template</text>
  <rect x="702" y="36" width="62" height="24" rx="5" class="soft"/><text class="t sm muted" x="716" y="52">Cancel</text>
  <rect x="774" y="36" width="86" height="24" rx="5" fill="#4f46e5"/><text class="t sm" x="790" y="52" fill="#ffffff">Save</text>

  <!-- Template details -->
  <rect x="28" y="72" width="832" height="62" rx="5" class="line"/>
  <text class="t sm bold" x="44" y="92">Template name</text>
  <rect x="44" y="98" width="190" height="22" rx="4" class="soft"/>
  <text class="t sm muted" x="54" y="113">Australia — Standard</text>
  <text class="t sm bold" x="250" y="92">Country</text>
  <rect x="250" y="98" width="110" height="22" rx="4" class="soft"/><text class="t sm muted" x="260" y="113">AU</text>
  <text class="t sm bold" x="376" y="92">Category</text>
  <rect x="376" y="98" width="180" height="22" rx="4" class="soft"/><text class="t sm muted" x="386" y="113">GraduateWork485</text>
  <text class="t sm bold" x="572" y="92">Description</text>
  <rect x="572" y="98" width="272" height="22" rx="4" class="soft"/>

  <!-- Step card -->
  <rect x="28" y="146" width="832" height="266" rx="5" class="line" stroke="#4f46e5"/>
  <rect x="28" y="146" width="832" height="26" rx="5" fill="#eef2ff"/>
  <text class="t sm bold" x="44" y="164" fill="#4f46e5">STEP 2</text>
  <g class="t sm muted"><text x="792" y="164">↑  ↓  ✕</text></g>

  <!-- identity row -->
  <text class="t sm" x="44" y="188">Key</text>
  <rect x="44" y="194" width="150" height="20" rx="4" class="soft"/><text class="t sm muted" x="52" y="208">ApplyOffer</text>
  <text class="t sm" x="208" y="188">Label</text>
  <rect x="208" y="194" width="170" height="20" rx="4" class="soft"/><text class="t sm muted" x="216" y="208">Apply for Offer</text>
  <text class="t sm" x="392" y="188">Phase</text>
  <rect x="392" y="194" width="140" height="20" rx="4" class="soft"/><text class="t sm muted" x="400" y="208">Application</text>
  <text class="t sm" x="546" y="188">Practitioner tag</text>
  <rect x="546" y="194" width="160" height="20" rx="4" class="soft"/><text class="t sm muted" x="554" y="208">Senior Caseworker</text>
  <text class="t sm" x="720" y="188">Description</text>
  <rect x="720" y="194" width="124" height="20" rx="4" class="soft"/>

  <!-- Fields -->
  <text class="t sm bold" x="44" y="238">Fields</text>
  <rect x="44" y="246" width="150" height="20" rx="4" class="soft"/><text class="t sm muted" x="52" y="260">Field key</text>
  <rect x="200" y="246" width="150" height="20" rx="4" class="soft"/><text class="t sm muted" x="208" y="260">Label</text>
  <rect x="356" y="246" width="110" height="20" rx="4" class="soft"/><text class="t sm" x="364" y="260">Select</text><text class="t sm muted" x="448" y="260">▾</text>
  <rect x="472" y="246" width="110" height="20" rx="4" class="soft"/><text class="t sm muted" x="480" y="260">Option text</text>
  <rect x="588" y="246" width="96" height="20" rx="4" class="soft"/><text class="t sm muted" x="596" y="260">+ Add option</text>
  <rect x="44" y="272" width="96" height="20" rx="4" class="soft" stroke="#4f46e5"/><text class="t sm" x="52" y="286" fill="#4f46e5">+ Add field</text>

  <!-- Evidence -->
  <text class="t sm bold" x="44" y="316">Evidence categories</text>
  <rect x="44" y="324" width="150" height="20" rx="4" class="soft"/><text class="t sm muted" x="52" y="338">e.g. CoE</text>
  <rect x="200" y="324" width="46" height="20" rx="4" class="soft" stroke="#4f46e5"/><text class="t sm" x="210" y="338" fill="#4f46e5">Add</text>
  <rect x="260" y="324" width="66" height="20" rx="10" fill="#e0e7ff"/><text class="t sm" x="270" y="338" fill="#4338ca">Offer ×</text>

  <!-- Preconditions -->
  <text class="t sm bold" x="440" y="316">Preconditions</text>
  <rect x="440" y="324" width="180" height="20" rx="4" class="soft"/><text class="t sm" x="448" y="338">PriorStepFieldNotEmpty</text>
  <rect x="626" y="324" width="106" height="20" rx="4" class="soft"/><text class="t sm muted" x="634" y="338">Source step key</text>
  <rect x="738" y="324" width="106" height="20" rx="4" class="soft"/><text class="t sm muted" x="746" y="338">Field key</text>
  <rect x="440" y="350" width="404" height="20" rx="4" class="soft" fill="#fffbeb" stroke="#fcd34d"/>
  <text class="t sm" x="448" y="364" fill="#92400e">Human-readable explanation — shown to staff when this blocks them</text>

  <!-- Hints -->
  <text class="t sm bold" x="44" y="366">Hints</text>
  <rect x="44" y="374" width="290" height="20" rx="4" class="soft"/>
  <text class="t sm muted" x="52" y="388">Share a tip for staff working this step…</text>
  <rect x="340" y="374" width="46" height="20" rx="4" fill="#4f46e5"/><text class="t sm" x="352" y="388" fill="#ffffff">Add</text>

  <rect x="28" y="424" width="832" height="24" rx="5" class="soft" stroke="#4f46e5"/>
  <text class="t sm" x="416" y="440" fill="#4f46e5">+ Add step</text>

  <!-- Callouts -->
  <circle class="cal" cx="14" cy="204" r="11"/><text class="caltx" x="10.5" y="208">1</text>
  <circle class="cal" cx="14" cy="256" r="11"/><text class="caltx" x="10.5" y="260">2</text>
  <circle class="cal" cx="14" cy="334" r="11"/><text class="caltx" x="10.5" y="338">3</text>
  <circle class="cal" cx="422" cy="334" r="11"/><text class="caltx" x="418.5" y="338">4</text>
  <circle class="cal" cx="422" cy="360" r="11"/><text class="caltx" x="418.5" y="364">5</text>
  <circle class="cal" cx="14" cy="384" r="11"/><text class="caltx" x="10.5" y="388">6</text>
</svg>
