<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Annotated wireframe of the Forms tab: scope tabs, form buttons, response view and staff actions">
  <style>
    .t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .muted { fill: #94a3b8; }
    .sm    { font-size: 11px; }
    .md    { font-size: 13px; }
    .bold  { font-weight: 600; }
    .line  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .soft  { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .cal   { fill: #ea580c; }
    .caltx { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="430" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="429" rx="6" class="line"/>

  <!-- Record tab bar -->
  <line x1="0" y1="40" x2="900" y2="40" class="line"/>
  <g class="t sm muted">
    <text x="30" y="27">VISA Process</text>
    <text x="126" y="27">Documents</text>
    <text x="290" y="27">Communication</text>
    <text x="400" y="27">Audit Trail</text>
    <text x="480" y="27">Tasks</text>
  </g>
  <text class="t sm bold" x="216" y="27">Forms</text>
  <line x1="210" y1="40" x2="262" y2="40" stroke="#4f46e5" stroke-width="2"/>

  <rect x="736" y="52" width="124" height="26" rx="5" fill="#4f46e5"/>
  <text class="t sm" x="754" y="69" fill="#ffffff">Request a form</text>

  <!-- Scope tabs -->
  <rect x="28" y="52" width="86" height="26" rx="5" fill="#e0e7ff"/>
  <text class="t sm bold" x="40" y="69" fill="#4338ca">Active</text>
  <circle cx="98" cy="65" r="8" fill="#4f46e5"/><text class="t sm" x="95" y="68" fill="#ffffff">2</text>
  <rect x="122" y="52" width="98" height="26" rx="5" class="soft"/>
  <text class="t sm muted" x="134" y="69">Archived</text>
  <circle cx="204" cy="65" r="8" fill="#e2e8f0"/><text class="t sm" x="201" y="68">1</text>

  <!-- Form buttons -->
  <rect x="28" y="90" width="200" height="26" rx="5" fill="#f1f5f9" stroke="#4f46e5"/>
  <text class="t sm" x="40" y="107">Declaration</text>
  <rect x="122" y="97" width="66" height="14" rx="7" fill="#dcfce7"/><text class="t sm" x="128" y="108" fill="#15803d">Responded</text>
  <rect x="238" y="90" width="196" height="26" rx="5" class="soft"/>
  <text class="t sm muted" x="250" y="107">Health cover</text>
  <rect x="334" y="97" width="70" height="14" rx="7" fill="#e2e8f0"/><text class="t sm" x="340" y="108">Requesting</text>

  <!-- Response main -->
  <rect x="28" y="130" width="560" height="270" rx="5" class="line"/>
  <text class="t sm bold" x="46" y="152">Declaration Form</text>
  <line x1="46" y1="162" x2="570" y2="162" class="soft"/>
  <g class="t sm muted">
    <text x="46" y="184">1. Describe your study goals</text>
    <text x="60" y="202">Answer text…</text>
    <text x="46" y="232">2. Do you currently hold a visa?</text>
    <text x="60" y="250">Yes</text>
    <text x="46" y="280">3. Which support services interest you?</text>
    <text x="60" y="298">Accommodation, Career advice</text>
  </g>
  <text class="t sm muted" x="46" y="344">Submitted 14/08/2026</text>

  <!-- Side -->
  <rect x="600" y="130" width="260" height="104" rx="5" class="line"/>
  <text class="t sm bold" x="616" y="150">Request details</text>
  <g class="t sm muted">
    <text x="616" y="172">Status</text><text x="616" y="192">Requested</text><text x="616" y="212">Submitted</text>
  </g>
  <rect x="768" y="162" width="66" height="14" rx="7" fill="#dcfce7"/><text class="t sm" x="774" y="173" fill="#15803d">Responded</text>
  <text class="t sm" x="726" y="192">12/08 · Jo D</text>
  <text class="t sm" x="748" y="212">14/08/2026</text>

  <rect x="600" y="246" width="260" height="154" rx="5" class="line"/>
  <text class="t sm bold" x="616" y="266">Staff actions</text>
  <g>
    <rect x="616" y="276" width="228" height="20" rx="4" class="soft"/><text class="t sm muted" x="626" y="290">Export PDF</text>
    <rect x="616" y="302" width="228" height="20" rx="4" class="soft"/><text class="t sm muted" x="626" y="316">Edit response</text>
    <rect x="616" y="328" width="228" height="20" rx="4" class="soft" stroke="#4f46e5"/><text class="t sm" x="626" y="342" fill="#4f46e5">Allow edit</text>
    <rect x="616" y="354" width="228" height="20" rx="4" class="soft" stroke="#dc2626"/><text class="t sm" x="626" y="368" fill="#dc2626">Withdraw request</text>
    <rect x="616" y="380" width="228" height="20" rx="4" class="soft"/><text class="t sm muted" x="626" y="394">Change status</text>
  </g>

  <!-- Callouts -->
  <circle class="cal" cx="14" cy="65" r="11"/><text class="caltx" x="10.5" y="69">1</text>
  <circle class="cal" cx="14" cy="103" r="11"/><text class="caltx" x="10.5" y="107">2</text>
  <circle class="cal" cx="798" cy="40" r="11"/><text class="caltx" x="794.5" y="44">3</text>
  <circle class="cal" cx="588" cy="180" r="11"/><text class="caltx" x="584.5" y="184">4</text>
  <circle class="cal" cx="878" cy="182" r="11"/><text class="caltx" x="874.5" y="186">5</text>
  <circle class="cal" cx="878" cy="390" r="11"/><text class="caltx" x="874.5" y="394">6</text>
</svg>
